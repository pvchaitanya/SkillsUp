  <p><b>Approach — simulation:</b> maintain a StringBuilder per row. Walk through the input, appending each character to the current row's builder. Track current row and direction; flip direction at row 0 or row numRows-1. Concatenate all rows at the end.</p>`,

  <li>row=0,dir=down: 'P'→row0. row=1: 'A'→row1. row=2: 'Y'→row2 (flip to up)</li>
  <li>row=1: 'P'→row1. row=0: 'A'→row0 (flip to down)</li>

  code:`class Solution {
    public String convert(String s, int numRows) {
        if (numRows == 1) return s;
        List<StringBuilder> rows = new ArrayList<>();
        for (int i = 0; i < Math.min(numRows, s.length()); i++) {
            rows.add(new StringBuilder());
        }
        int currentRow = 0;
        boolean goingDown = false;
        for (char c : s.toCharArray()) {
            rows.get(currentRow).append(c);
            if (currentRow == 0 || currentRow == numRows - 1) {
                goingDown = !goingDown;
            }
            currentRow += goingDown ? 1 : -1;
        }

  <p><b>Common mistake:</b> not handling '0' correctly.</p>`,
  thoughtProcess:`<p><b>Observe:</b> at each position, decode ONE digit (if 1-9) or TWO digits together (if 10-26). This is a decision-at-each-step problem — a strong DP signal.</p>
  <p><b>Recurrence:</b> dp[i] = dp[i-1] (if valid single digit) + dp[i-2] (if valid two-digit code 10-26). Base: dp[0]=1.</p>
  <p><b>Why DP:</b> overlapping subproblems, optimal substructure — mirrors "Climbing Stairs" gated by validity checks.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "count ways to decode/partition/tile" with 1 or 2 choices per step → DP-1D, Fibonacci-like recurrence gated by validity. <b>Mental model:</b> climbing stairs where invalid moves contribute 0.</p>

  <li>dp[2]: '2' valid single (+=dp[1]=1); "22" valid pair (+=dp[0]=1). dp[2]=2</li>
  <li>dp[3]: '6' valid single (+=dp[2]=2); "26" valid pair (+=dp[1]=1). dp[3]=3</li>
  </ul><p>Result: 3 ✓</p>`,
  code:`class Solution {
    public int numDecodings(String s) {
        int n = s.length();
        if (n == 0 || s.charAt(0) == '0') return 0;
        int[] dp = new int[n + 1];
        dp[0] = 1;
        dp[1] = 1;
        for (int i = 2; i <= n; i++) {
            int oneDigit = s.charAt(i - 1) - '0';
            if (oneDigit >= 1 && oneDigit <= 9) {
                dp[i] += dp[i - 1];
            }
            int twoDigit = Integer.parseInt(s.substring(i - 2, i));
            if (twoDigit >= 10 && twoDigit <= 26) {
                dp[i] += dp[i - 2];
            }
        }
        return dp[n];
    }

  thoughtProcess:`<p><b>Observe:</b> any delimiter could appear inside a string, corrupting decode. We need a scheme immune to content.</p>
  <p><b>Key insight:</b> prefix each string with its LENGTH followed by an unambiguous delimiter — e.g. "5#Hello5#World". Decoding reads the length, then consumes exactly that many characters.</p>

  </ul><p>Result: ["Hello","World"] ✓</p>`,
  code:`class Codec {
    public String encode(List<String> strs) {
        StringBuilder sb = new StringBuilder();
        for (String s : strs) {
            sb.append(s.length()).append('#').append(s);
        }
        return sb.toString();
    }
    public List<String> decode(String s) {
        List<String> result = new ArrayList<>();
        int i = 0;
        while (i < s.length()) {
            int j = i;
            while (s.charAt(j) != '#') {

            }
            int length = Integer.parseInt(s.substring(i, j));

  <p><b>Why memoize:</b> plain recursion recomputes the same (i,j) repeatedly — exponential blowup without memoization.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "'*' means zero-or-more of preceding element" → 2D DP over (string index, pattern index) with branching at '*'. <b>Mental model:</b> at every '*' you choose "skip entirely" or "consume-and-stay."</p>

    public boolean isMatch(String s, String p) {
        int m = s.length(), n = p.length();
        Boolean[][] memo = new Boolean[m + 1][n + 1];
        return helper(s, p, 0, 0, memo);
    }
    private boolean helper(String s, String p, int i, int j, Boolean[][] memo) {
        if (memo[i][j] != null) return memo[i][j];
        boolean result;
        if (j == p.length()) {
            result = (i == s.length());
        } else {
            boolean firstMatch = (i < s.length()) &&

  statement:`<p><b>Description:</b> Given two strings <code>s</code> and <code>t</code>, return the minimum window substring of s containing every character in t (including duplicates). Return "" if none exists.</p>
  <div class="example-box"><code>s="ADOBECODEBANC", t="ABC"</code> → <code>"BANC"</code></div>
  <p><b>Constraints:</b> 1 ≤ s.length, t.length ≤ 10⁵.</p>
  <p><b>Edge cases:</b> t longer than s, t has duplicate characters, no valid window exists.</p>
  <p><b>Interview expectations:</b> the canonical "hard" sliding window — a "satisfied count" tracked in O(1), not full frequency map comparisons.</p>`,
  whyAsked:`<p>The definitive test of advanced sliding-window mastery: expand to find validity, shrink to minimize, with an efficient satisfied-counter.</p>
  <p><b>Common mistake:</b> re-scanning the full frequency map at every step instead of using a satisfied counter.</p>`,
  thoughtProcess:`<p><b>Observe:</b> we need the smallest window containing all of t's characters (with multiplicity) — the classic shrinking sliding window pattern.</p>
  <p><b>Brute force:</b> check every substring — O(n²) or worse.</p>
  <p><b>Optimal:</b> build a required-frequency map from t. Expand right; when a character's window count reaches its requirement, increment "satisfied". While satisfied == distinct requirements, shrink left, updating the best window, decrementing satisfied when a requirement breaks.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "minimum window containing all characters of another string (with multiplicity)" → variable-size window with a satisfied counter. <b>Mental model:</b> expand to search, shrink to tighten.</p>
  <p><b>When NOT to use:</b> if only DISTINCT containment matters (no multiplicity), a simpler HashSet-based window may suffice.</p>`,
  dryRun:`<p>s="ADOBECODEBANC", t="ABC". Required {A:1,B:1,C:1}.</p><ul>
  <li>Expand to index5(C): satisfied=3, window "ADOBEC" len6, can't shrink further.</li>
  <li>Continue expanding/shrinking; eventually window [9,12]="BANC" is valid and minimal, len4.</li>
  </ul><p>Result: "BANC" ✓</p>`,
  code:`class Solution {
    public String minWindow(String s, String t) {
        if (s.length() < t.length()) return "";
        Map<Character, Integer> required = new HashMap<>();
        for (char c : t.toCharArray()) {
            required.merge(c, 1, Integer::sum);
        }
        int requiredDistinct = required.size();
        int satisfied = 0;
        Map<Character, Integer> windowCounts = new HashMap<>();
        int left = 0;
        int bestLen = Integer.MAX_VALUE, bestStart = 0;
        for (int right = 0; right < s.length(); right++) {
            char c = s.charAt(right);
            windowCounts.merge(c, 1, Integer::sum);
            if (required.containsKey(c) && windowCounts.get(c).intValue() == required.get(c).intValue()) {
                satisfied++;
            }
            while (satisfied == requiredDistinct) {
                if (right - left + 1 < bestLen) {
                    bestLen = right - left + 1;
                    bestStart = left;
                }
                char leftChar = s.charAt(left);
                windowCounts.put(leftChar, windowCounts.get(leftChar) - 1);
                if (required.containsKey(leftChar) && windowCounts.get(leftChar) < required.get(leftChar)) {
                    satisfied--;
                }
                left++;
            }
        }
        return bestLen == Integer.MAX_VALUE ? "" : s.substring(bestStart, bestStart + bestLen);
    }
}`,
  complexity:{time:"O(m + n)", space:"O(k) distinct characters in t", best:"O(n)", avg:"O(n)", worst:"O(n)"},
  tips:`<p><b>Memory trick:</b> "satisfied counter tracks requirement transitions." <b>Trap:</b> comparing boxed Integers with == is unsafe outside -128..127 — use .intValue() or .equals().</p>`,
  similar:[
    {title:"Longest Substring Without Repeating Characters", difficulty:"Medium", pattern:"Sliding Window", note:"simpler sliding window, distinct characters only", url:"https://leetcode.com/problems/longest-substring-without-repeating-characters/"},
    {title:"Permutation in String", difficulty:"Medium", pattern:"Sliding Window", note:"fixed-size window with exact frequency matching", url:"https://leetcode.com/problems/permutation-in-string/"},
    {title:"Find All Anagrams in a String", difficulty:"Medium", pattern:"Sliding Window", note:"related frequency-matching window problem", url:"https://leetcode.com/problems/find-all-anagrams-in-a-string/"},
    {title:"Longest Repeating Character Replacement", difficulty:"Medium", pattern:"Sliding Window", note:"another advanced variable-size window problem", url:"https://leetcode.com/problems/longest-repeating-character-replacement/"}
  ],
  revision:`<p><b>Formula:</b> expand right tracking satisfied count; shrink left while satisfied, recording best window. <b>Recognize by:</b> "minimum window containing all characters (with multiplicity)." <b>Avoid when:</b> only distinct containment matters.</p>`,
  variations:`<p><b>"What if only distinct characters matter?"</b> Simplify to a HashSet-based window. <b>"What if you need ALL minimum windows?"</b> Keep scanning, recording every tie. <b>"What about Unicode?"</b> The HashMap approach already generalizes.</p>`,
  practice:[
    "Find the minimum window in s containing all DISTINCT characters of t (ignore multiplicity).",
    "Given s and t, determine if s contains a PERMUTATION of t as a contiguous substring.",
    "Find all starting indices where an anagram of t occurs in s.",
    "Given s, find the minimum window that contains at least k distinct characters.",
    "Given s and t, find the minimum window containing all characters of t allowing a bounded gap (conceptual)."
  ]
},
{
  title:"Text Justification", difficulty:"Hard", companies:["Amazon","Meta","Google"], estTime:"30 min",
  statement:`<p><b>Description:</b> Given an array of strings <code>words</code> and a width <code>maxWidth</code>, format the text so each line has exactly maxWidth characters and is fully justified. Pack words greedily. Distribute extra spaces as evenly as possible, leftmost gaps getting more when uneven. The LAST line and single-word lines are left-justified, padded with trailing spaces.</p>
  <div class="example-box"><code>words=["This","is","an","example",...], maxWidth=16</code> → lines like <code>"This    is    an"</code></div>
  <p><b>Constraints:</b> 1 ≤ words.length ≤ 300, word length ≤ maxWidth.</p>
  <p><b>Edge cases:</b> single-word lines, last line, uneven space distribution.</p>
  <p><b>Interview expectations:</b> a meticulous simulation problem — success depends on handling every special case correctly.</p>`,
  whyAsked:`<p>No clever trick — tests whether you can carefully implement a real formatting specification without missing edge cases.</p>
  <p><b>Common mistake:</b> forgetting the last-line/single-word left-justify special case, or miscalculating uneven space distribution.</p>`,
  thoughtProcess:`<p><b>Observe:</b> two phases — (1) greedily group words into lines that fit maxWidth, (2) format each group per the justification rules.</p>
  <p><b>Phase 1:</b> keep adding words while (total length + minimum spaces) fits maxWidth.</p>
  <p><b>Phase 2:</b> for normal lines, totalSpaces = maxWidth - wordLengths; gaps = numWords-1; base = totalSpaces/gaps, extra = totalSpaces%gaps; first 'extra' gaps get one additional space. Last/single-word lines: single spaces, pad end.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "distribute extra space evenly, remainder to the left," "greedy line-packing" → simulate greedily, then apply divide+modulo arithmetic with explicit special-casing. <b>Mental model:</b> like a real word processor's justify feature.</p>
  <p><b>When NOT to use:</b> if only left-alignment is needed, skip the space-distribution math.</p>`,
  dryRun:`<p>words=["This","is","an"], maxWidth=16</p><ul>
  <li>Pack: total=8, min-spaces=2, fits 16. totalSpaces=16-8=8, gaps=2, base=4,extra=0.</li>
  <li>Result: "This" + 4 spaces + "is" + 4 spaces + "an" = "This    is    an" (16 chars) ✓</li>
  </ul>`,
  code:`class Solution {
    public List<String> fullJustify(String[] words, int maxWidth) {
        List<String> result = new ArrayList<>();
        int i = 0;
        int n = words.length;
        while (i < n) {
            int lineLength = words[i].length();
            int j = i + 1;
            while (j < n && lineLength + 1 + words[j].length() <= maxWidth) {
                lineLength += 1 + words[j].length();
                j++;
            }
            int numWordsInLine = j - i;
            StringBuilder line = new StringBuilder();
            if (j == n || numWordsInLine == 1) {
                for (int k = i; k < j; k++) {
                    line.append(words[k]);
                    if (k < j - 1) line.append(' ');
                }
                while (line.length() < maxWidth) {
                    line.append(' ');
                }
            } else {
                int totalWordLength = 0;
                for (int k = i; k < j; k++) totalWordLength += words[k].length();
                int totalSpaces = maxWidth - totalWordLength;
                int gaps = numWordsInLine - 1;
                int baseSpaces = totalSpaces / gaps;
                int extraSpaces = totalSpaces % gaps;
                for (int k = i; k < j; k++) {
                    line.append(words[k]);
                    if (k < j - 1) {
                        int spacesHere = baseSpaces + (k - i < extraSpaces ? 1 : 0);
                        for (int s = 0; s < spacesHere; s++) line.append(' ');
                    }
                }
            }
            result.add(line.toString());
            i = j;
        }
        return result;
    }
}`,
  complexity:{time:"O(total characters)", space:"O(total output)", best:"O(n)", avg:"O(n)", worst:"O(n)"},
  tips:`<p><b>Memory trick:</b> "greedy pack, then distribute remainder-first-to-the-left." <b>Trap:</b> forgetting the single-word-mid-document special case.</p>`,
  similar:[
    {title:"Zigzag Conversion", difficulty:"Medium", pattern:"String Simulation", note:"similar meticulous simulation discipline", url:"https://leetcode.com/problems/zigzag-conversion/"},
    {title:"Word Wrap (classic CS problem)", difficulty:"Hard", pattern:"DP", note:"optimal line-breaking via DP instead of greedy", url:"https://leetcode.com/problems/text-justification/"},
    {title:"Rearrange Spaces Between Words", difficulty:"Easy", pattern:"String Simulation", note:"simpler space-distribution problem", url:"https://leetcode.com/problems/rearrange-spaces-between-words/"}
  ],
  revision:`<p><b>Formula:</b> greedy pack; distribute totalSpaces across gaps with extras to leftmost; last/single-word lines left-justified and end-padded. <b>Recognize by:</b> "fully justify text to exact width." <b>Avoid when:</b> only ragged-left alignment needed.</p>`,
  variations:`<p><b>"What if you want OPTIMAL line breaks?"</b> Classic "Word Wrap" DP minimizing raggedness. <b>"What if right-justified instead?"</b> Skip space-distribution, block-pad instead. <b>"What if hyphenation is allowed?"</b> Much harder — requires valid hyphenation point decisions.</p>`,
  practice:[
    "Left-justify text only (ragged right edge), no space distribution needed.",
    "Implement the DP-based optimal word wrap minimizing total raggedness.",
    "Given text and a width, count the minimum number of lines needed without producing the text.",
    "Justify text where each line must also start with a fixed-width line-number prefix.",
    "Given justified text, reverse-engineer and reconstruct the original single-spaced word list."
  ]
}
];

/* =========================================================
   STATE
   ========================================================= */
let activePatternId = 'arrays';
let searchTerm = '';
let activeFilters = { difficulty:null, status:null };
const SECTIONS = [
  {key:'statement', label:'Problem'},
  {key:'whyAsked', label:'Why Asked'},
  {key:'thoughtProcess', label:'Thought Process'},
  {key:'logicalReasoning', label:'Logical Reasoning'},
  {key:'dryRun', label:'Dry Run'},
  {key:'code', label:'Java Solution'},
  {key:'complexity', label:'Complexity'},
  {key:'tips', label:'Interview Tips'},
  {key:'similar', label:'Similar Problems'},
  {key:'revision', label:'Revision Notes'},
  {key:'variations', label:'Variations'},
  {key:'practice', label:'Practice Exercises'}
];

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* Tiny Java syntax highlighter — regex based, no external libs */
function highlightJava(code){
  let s = escapeHtml(code);
  s = s.replace(/(\/\/.*$)/gm, '<span class="tok-com">$1</span>');
  s = s.replace(/(&quot;.*?&quot;|"(?:[^"\\]|\\.)*")/g, '<span class="tok-str">$1</span>');
  const kws = ['class','public','private','protected','static','void','int','long','double','float','boolean','char','String','return','if','else','for','while','new','this','import','package','throw','throws','try','catch','finally','break','continue','null','true','false','extends','implements','interface','final','super'];
  const kwPattern = new RegExp('\\b(' + kws.join('|') + ')\\b', 'g');
  s = s.replace(kwPattern, '<span class="tok-kw">$1</span>');
  s = s.replace(/\b(\d+)\b/g, '<span class="tok-num">$1</span>');
  return s;
}

/* =========================================================
   RENDER: SIDEBAR
   ========================================================= */
function renderSidebar(){
  const ul = document.getElementById('pattern-list');
  ul.innerHTML = '';
  PATTERNS.forEach((p, idx) => {
    const problems = PATTERN_DATA[p.id];
    const has = problems && problems.length > 0;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'pattern-btn' + (p.id===activePatternId?' active':'') + (has?'':' soon');
    btn.innerHTML = `<span style="display:flex;align-items:center;gap:8px;"><span class="num">${String(idx+1).padStart(2,'0')}</span>${p.name}</span>` +
      (has ? `<span class="count">${problems.length}</span>` : `<span class="count">soon</span>`);
    if(has){
      btn.onclick = () => { activePatternId = p.id; renderAll(); };
    }
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

/* =========================================================
   RENDER: DASHBOARD + FILTERS
   ========================================================= */
function allPopulatedProblems(){
  let all = [];
  Object.keys(PATTERN_DATA).forEach(pid => {
    (PATTERN_DATA[pid]||[]).forEach(prob => all.push({...prob, patternId:pid}));
  });
  return all;
}

function renderDashboard(){
  const all = allPopulatedProblems();
  const totalPatterns = PATTERNS.length;
  const totalProblems = all.length;
  const completedCount = all.filter(p => completed[p.patternId+'::'+p.title]).length;
  const remaining = totalProblems - completedCount;
  const pct = totalProblems ? Math.round((completedCount/totalProblems)*100) : 0;

  const stats = [
    {label:'Total Patterns (roadmap)', value: totalPatterns},
    {label:'Problems Available Now', value: totalProblems},
    {label:'Completed', value: completedCount},
    {label:'Remaining', value: remaining},
    {label:'Completion %', value: pct + '%'}
  ];
  document.getElementById('dashboard').innerHTML = stats.map(s =>
    `<div class="stat-card"><div class="label">${s.label}</div><div class="value">${s.value}</div></div>`
  ).join('');
  document.getElementById('progress-bar-inner').style.width = pct + '%';
}

function renderFilters(){
  const row = document.getElementById('filters-row');
  const diffs = ['Easy','Medium','Hard'];
  const statuses = [
    {key:'completed', label:'✓ Completed'},
    {key:'bookmarked', label:'★ Bookmarked'}
  ];
  const companies = ['Amazon','Google','Meta','Microsoft','Apple','Netflix','Uber','Adobe','Oracle','Salesforce'];

  let html = '';
  diffs.forEach(d => {
    html += `<button class="chip ${d.toLowerCase()} ${activeFilters.difficulty===d?'on':''}" data-difficulty="${d}">${d}</button>`;
  });
  statuses.forEach(s => {
    html += `<button class="chip ${activeFilters.status===s.key?'on':''}" data-status="${s.key}">${s.label}</button>`;
  });
  companies.forEach(c => {
    html += `<button class="chip ${activeFilters.company===c?'on':''}" data-company="${c}">${c}</button>`;
  });
  row.innerHTML = html;

  row.querySelectorAll('[data-difficulty]').forEach(btn => btn.onclick = () => {
    activeFilters.difficulty = activeFilters.difficulty===btn.dataset.difficulty ? null : btn.dataset.difficulty;
    renderAll();
  });
  row.querySelectorAll('[data-status]').forEach(btn => btn.onclick = () => {
    activeFilters.status = activeFilters.status===btn.dataset.status ? null : btn.dataset.status;
    renderAll();
  });
  row.querySelectorAll('[data-company]').forEach(btn => btn.onclick = () => {
    activeFilters.company = activeFilters.company===btn.dataset.company ? null : btn.dataset.company;
    renderAll();
  });
}

/* =========================================================
   RENDER: PROBLEM LIST
   ========================================================= */
function matchesFilters(prob, patternId){
  if(activeFilters.difficulty && prob.difficulty !== activeFilters.difficulty) return false;
  if(activeFilters.company && !(prob.companies||[]).includes(activeFilters.company)) return false;
  const key = patternId+'::'+prob.title;
  if(activeFilters.status==='completed' && !completed[key]) return false;
  if(activeFilters.status==='bookmarked' && !bookmarked[key]) return false;
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    const hay = (prob.title+' '+prob.difficulty+' '+patternId).toLowerCase();
    if(!hay.includes(t)) return false;
  }
  return true;
}

function sectionHtml(prob, key, patternId){
  switch(key){
    case 'statement': return prob.statement;
    case 'whyAsked': return prob.whyAsked;
    case 'thoughtProcess': return prob.thoughtProcess;
    case 'logicalReasoning': return prob.logicalReasoning;
    case 'dryRun': return prob.dryRun;
    case 'code': {
      const id = 'code_' + patternId + '_' + prob.title.replace(/[^a-z0-9]/gi,'_');
      return `<pre class="code-block"><button class="copy-btn" onclick="copyCode('${id}')">Copy</button><code id="${id}">${highlightJava(prob.code)}</code></pre>`;
    }
    case 'complexity': {
      const c = prob.complexity;
      return `<div class="complexity-grid">
        <div class="c-item"><div class="k">Time</div><div class="v">${c.time}</div></div>
        <div class="c-item"><div class="k">Space</div><div class="v">${c.space}</div></div>
        <div class="c-item"><div class="k">Best case</div><div class="v" style="font-size:12.5px;">${c.best}</div></div>
        <div class="c-item"><div class="k">Average case</div><div class="v" style="font-size:12.5px;">${c.avg}</div></div>
        <div class="c-item"><div class="k">Worst case</div><div class="v" style="font-size:12.5px;">${c.worst}</div></div>
      </div>`;
    }
    case 'tips': return prob.tips;
    case 'similar': return prob.similar.map(s =>
      `<div class="similar-item"><span class="diff-badge ${s.difficulty}" style="font-size:9.5px;">${s.difficulty}</span> <a href="${s.url}" target="_blank" rel="noopener">${s.title}</a> <span style="color:var(--text-faint);">— ${s.pattern} · ${s.note}</span></div>`
    ).join('');
    case 'revision': return prob.revision;
    case 'variations': return prob.variations;
    case 'practice': return '<ul>' + prob.practice.map(p => `<li>${p}</li>`).join('') + '</ul>';
    default: return '';
  }
}

function renderProblemList(){
  const problems = PATTERN_DATA[activePatternId] || [];
  const pattern = PATTERNS.find(p => p.id === activePatternId);
  document.getElementById('pattern-heading').innerHTML = pattern ?
    `<h1>${pattern.name}</h1><p>15 hand-written interview problems, easy → hard. Every problem includes the full thought process, a dry run, clean Java code, complexity analysis, and revision notes — not just a solution to memorize.</p>` : '';

  const filtered = problems.filter(p => matchesFilters(p, activePatternId));
  const listEl = document.getElementById('problem-list');
  const emptyEl = document.getElementById('empty-state');

  if(filtered.length === 0){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = filtered.map((prob, i) => {
    const key = activePatternId + '::' + prob.title;
    const isDone = !!completed[key];
    const isBookmarked = !!bookmarked[key];
    const cardId = 'card_' + i + '_' + activePatternId;
    return `
    <div class="problem-card">
      <div class="problem-head" onclick="toggleCard('${cardId}')">
        <span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span class="title">${prob.title}</span>
        <span class="diff-badge ${prob.difficulty}">${prob.difficulty}</span>
        <button class="mini-btn ${isBookmarked?'on':''}" onclick="event.stopPropagation(); toggleBookmark('${key}')" title="Bookmark">★</button>
        <button class="mini-btn done ${isDone?'on':''}" onclick="event.stopPropagation(); toggleCompleted('${key}')" title="Mark complete">✓</button>
      </div>
      <div class="problem-meta">
        <span>⏱ ${prob.estTime}</span>
        ${(prob.companies||[]).slice(0,5).map(c=>`<span>${c}</span>`).join('')}
      </div>
      <div class="problem-body" id="body_${cardId}">
        <div class="section-toggle-row">
          ${SECTIONS.map(s => `<button class="sec-btn" onclick="toggleSection('${cardId}','${s.key}')" id="secbtn_${cardId}_${s.key}">${s.label}</button>`).join('')}
        </div>
        ${SECTIONS.map(s => `
          <div class="section-block" id="sec_${cardId}_${s.key}">
            <h4>${s.label}</h4>
            ${sectionHtml(prob, s.key, activePatternId)}
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

/* =========================================================
   INTERACTIONS
   ========================================================= */
function toggleCard(cardId){
  const body = document.getElementById('body_' + cardId);
  body.classList.toggle('open');
}
function toggleSection(cardId, key){
  const block = document.getElementById(`sec_${cardId}_${key}`);
  const btn = document.getElementById(`secbtn_${cardId}_${key}`);
  block.classList.toggle('open');
  btn.classList.toggle('on');
}
function toggleBookmark(key){
  bookmarked[key] = !bookmarked[key];
  saveProgress();
  renderAll();
}
function toggleCompleted(key){
  completed[key] = !completed[key];
  saveProgress();
  renderAll();
}
function copyCode(id){
  const el = document.getElementById(id);
  const text = el.innerText;
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).catch(()=>{});
  }
}

/* Theme toggle */
document.getElementById('theme-toggle').onclick = () => {
  const body = document.body;
  const isDark = body.getAttribute('data-theme') === 'dark';
  body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-toggle').textContent = isDark ? '☀️ Light' : '🌙 Dark';
};

/* Print */
document.getElementById('print-btn').onclick = () => window.print();

/* Search */
document.getElementById('search').addEventListener('input', (e) => {
  searchTerm = e.target.value;
  renderProblemList();
});

/* Back to top */
const backBtn = document.getElementById('back-to-top');
window.addEventListener('scroll', () => {
  backBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
});
backBtn.onclick = () => window.scrollTo({top:0, behavior:'smooth'});

/* =========================================================
   INIT
   ========================================================= */
function renderAll(){
  renderSidebar();
  renderDashboard();
  renderFilters();
  renderProblemList();
}
renderAll();
</script>
