<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Interview Mastery — Java Edition</title>
<style>
:root{
  --bg:#0f1115; --bg-elev:#161922; --bg-card:#1b1f2a; --bg-hover:#232838;
  --border:#2a2f3d; --text:#e8eaf0; --text-dim:#9aa1b4; --text-faint:#5b6377;
  --accent:#5b8cff; --accent-dim:#33456e;
  --easy:#3fce6f; --easy-bg:#123321; --medium:#ffb648; --medium-bg:#3a2b0f; --hard:#ff5c6c; --hard-bg:#3a1418;
  --code-bg:#11141c; --radius:10px; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif: Georgia, 'Times New Roman', serif;
}
[data-theme="light"]{
  --bg:#f6f7fb; --bg-elev:#ffffff; --bg-card:#ffffff; --bg-hover:#eef1fa;
  --border:#e1e4ee; --text:#1a1d29; --text-dim:#565d75; --text-faint:#8890a6;
  --accent:#3358d4; --accent-dim:#dbe3ff;
  --easy:#1e9e4e; --easy-bg:#e5f8ec; --medium:#c97a06; --medium-bg:#fff2dc; --hard:#d9364a; --hard-bg:#fde6e9;
  --code-bg:#f1f2f8;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--sans); background:var(--bg); color:var(--text);
  display:flex; min-height:100vh; transition:background .2s,color .2s;
}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:270px; min-width:270px; height:100vh; position:sticky; top:0;
  background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow-y:auto; z-index:50;
}
#sidebar .brand{
  padding:20px 18px 14px; border-bottom:1px solid var(--border);
}
#sidebar .brand .mark{
  font-family:var(--serif); font-size:22px; font-weight:700; letter-spacing:.3px;
  display:flex; align-items:center; gap:8px;
}
#sidebar .brand .mark .dot{width:9px;height:9px;border-radius:50%;background:var(--accent); display:inline-block;}
#sidebar .brand .sub{font-size:11.5px; color:var(--text-faint); margin-top:4px; letter-spacing:.4px; text-transform:uppercase;}
#pattern-list{list-style:none; padding:8px; flex:1; overflow-y:auto;}
#pattern-list li{margin-bottom:2px;}
.pattern-btn{
  width:100%; text-align:left; background:none; border:none; color:var(--text-dim);
  padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; display:flex; align-items:center;
  justify-content:space-between; gap:8px; font-family:var(--sans); transition:background .12s,color .12s;
}
.pattern-btn:hover{background:var(--bg-hover); color:var(--text);}
.pattern-btn.active{background:var(--accent-dim); color:var(--accent); font-weight:600;}
.pattern-btn .num{font-family:var(--mono); font-size:10.5px; color:var(--text-faint); min-width:20px;}
.pattern-btn.active .num{color:var(--accent);}
.pattern-btn .count{font-size:10.5px; background:var(--bg); border:1px solid var(--border); padding:1px 6px; border-radius:20px; color:var(--text-faint);}
.pattern-btn.soon{opacity:.45; cursor:default;}
.pattern-btn.soon:hover{background:none; color:var(--text-dim);}
#sidebar .foot{padding:12px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-faint);}

/* ---------- MAIN ---------- */
#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:40; background:var(--bg); border-bottom:1px solid var(--border);
  padding:14px 28px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
#search{
  flex:1; min-width:180px; background:var(--bg-card); border:1px solid var(--border); color:var(--text);
  padding:9px 14px; border-radius:8px; font-size:13.5px; font-family:var(--sans);
}
#search:focus{outline:none; border-color:var(--accent);}
.icon-btn{
  background:var(--bg-card); border:1px solid var(--border); color:var(--text-dim); padding:9px 12px;
  border-radius:8px; cursor:pointer; font-size:13px; font-family:var(--sans); white-space:nowrap;
}
.icon-btn:hover{color:var(--text); border-color:var(--accent);}
.filters-row{padding:12px 28px; display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--bg-elev);}
.chip{
  border:1px solid var(--border); background:var(--bg-card); color:var(--text-dim); padding:6px 13px;
  border-radius:20px; font-size:12px; cursor:pointer; font-family:var(--sans);
}
.chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
.chip.easy.on{background:var(--easy); border-color:var(--easy); color:#052a10;}
.chip.medium.on{background:var(--medium); border-color:var(--medium); color:#2b1c00;}
.chip.hard.on{background:var(--hard); border-color:var(--hard); color:#3a0006;}

/* ---------- DASHBOARD ---------- */
#dashboard{padding:20px 28px 6px; display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
.stat-card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
.stat-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--text-faint);}
.stat-card .value{font-family:var(--serif); font-size:26px; margin-top:4px;}
#progress-wrap{padding:4px 28px 18px;}
#progress-bar-outer{height:8px; background:var(--bg-card); border:1px solid var(--border); border-radius:20px; overflow:hidden;}
#progress-bar-inner{height:100%; background:linear-gradient(90deg,var(--accent),var(--easy)); width:0%; transition:width .3s;}

/* ---------- CONTENT ---------- */
#content{padding:8px 28px 60px;}
#pattern-heading{padding:14px 0 4px;}
#pattern-heading h1{font-family:var(--serif); font-size:28px;}
#pattern-heading p{color:var(--text-dim); font-size:13.5px; margin-top:4px; max-width:760px;}

.problem-card{
  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
  margin:14px 0; overflow:hidden;
}
.problem-head{padding:16px 18px; display:flex; align-items:center; gap:12px; cursor:pointer; flex-wrap:wrap;}
.problem-head .idx{font-family:var(--mono); color:var(--text-faint); font-size:12px; min-width:24px;}
.problem-head .title{font-weight:600; font-size:15.5px; flex:1;}
.diff-badge{font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.3px;}
.diff-badge.Easy{background:var(--easy-bg); color:var(--easy);}
.diff-badge.Medium{background:var(--medium-bg); color:var(--medium);}
.diff-badge.Hard{background:var(--hard-bg); color:var(--hard);}
.mini-btn{background:none; border:1px solid var(--border); color:var(--text-faint); border-radius:7px; padding:6px 8px; cursor:pointer; font-size:13px;}
.mini-btn.on{color:var(--accent); border-color:var(--accent);}
.mini-btn.done.on{color:var(--easy); border-color:var(--easy);}
.problem-meta{font-size:11px; color:var(--text-faint); padding:0 18px 14px; display:flex; gap:10px; flex-wrap:wrap;}
.problem-meta span{background:var(--bg-elev); border:1px solid var(--border); padding:2px 8px; border-radius:6px;}
.problem-body{border-top:1px solid var(--border); display:none; padding:6px 18px 18px;}
.problem-body.open{display:block;}

.section-toggle-row{display:flex; flex-wrap:wrap; gap:6px; padding:14px 0 6px;}
.sec-btn{
  background:var(--bg-elev); border:1px solid var(--border); color:var(--text-dim); font-size:11.5px;
  padding:6px 11px; border-radius:7px; cursor:pointer; font-family:var(--sans);
}
.sec-btn.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.section-block{display:none; padding:14px 0; border-top:1px dashed var(--border); margin-top:10px;}
.section-block.open{display:block;}
.section-block h4{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--accent); margin-bottom:8px;}
.section-block p, .section-block li{font-size:13.8px; line-height:1.65; color:var(--text); margin-bottom:8px;}
.section-block ul{padding-left:20px;}
.section-block .label{color:var(--text-dim); font-weight:600;}
.example-box{background:var(--bg-elev); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin:8px 0; font-size:13px;}
.example-box code{font-family:var(--mono); color:var(--accent);}

pre.code-block{
  background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:14px 16px;
  overflow-x:auto; font-family:var(--mono); font-size:12.6px; line-height:1.6; position:relative;
}
.copy-btn{position:absolute; top:8px; right:8px; background:var(--bg-card); border:1px solid var(--border); color:var(--text-dim); font-size:11px; padding:4px 9px; border-radius:6px; cursor:pointer;}
.tok-kw{color:#c792ea;} .tok-str{color:#a6e22e;} .tok-com{color:#6b7385; font-style:italic;} .tok-type{color:#66d9ef;} .tok-num{color:#ffb648;}

.complexity-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
.complexity-grid .c-item{background:var(--bg-elev); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
.complexity-grid .c-item .k{font-size:10.5px; color:var(--text-faint); text-transform:uppercase;}
.complexity-grid .c-item .v{font-family:var(--mono); font-size:15px; color:var(--accent); margin-top:2px;}

.similar-item{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
.similar-item:last-child{border-bottom:none;}
.similar-item a{color:var(--accent); text-decoration:none;}
.similar-item a:hover{text-decoration:underline;}

#back-to-top{
  position:fixed; bottom:24px; right:24px; background:var(--accent); color:#fff; border:none;
  width:42px; height:42px; border-radius:50%; cursor:pointer; font-size:16px; display:none; z-index:60;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
}
#empty-state{padding:60px 20px; text-align:center; color:var(--text-faint);}
#empty-state h2{font-family:var(--serif); color:var(--text-dim); margin-bottom:8px;}

@media print{
  #sidebar, #topbar, .filters-row, #back-to-top, .section-toggle-row, .mini-btn{display:none !important;}
  .section-block{display:block !important;}
  body{background:#fff; color:#000;}
}
@media (max-width:900px){
  body{flex-direction:column;}
  #sidebar{position:relative; width:100%; height:auto; max-height:280px;}
  #dashboard{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body data-theme="dark">

<aside id="sidebar">
  <div class="brand">
    <div class="mark"><span class="dot"></span>DSA Mastery</div>
    <div class="sub">Java · Interview Patterns</div>
  </div>
  <ul id="pattern-list"></ul>

</aside>

<div id="main">
  <div id="topbar">
    <input id="search" type="text" placeholder="Search problem name, pattern, or difficulty…">
    <button class="icon-btn" id="theme-toggle">🌙 Dark</button>
    <button class="icon-btn" id="print-btn">🖨 Print</button>
  </div>
  <div class="filters-row" id="filters-row"></div>

      <p>Try clearing search or filters from the bar above.</p>

</div>

<button id="back-to-top" title="Back to top">↑</button>

<script>
/* =========================================================
   STORAGE (safe fallback: real localStorage when available —
   e.g. when this file is opened directly in a browser — else
   an in-memory store for the current session)
   ========================================================= */
const Store = (function(){
  let mem = {};
  let ok = false;
  try{
    const t='__t__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); ok=true;
  }catch(e){ ok=false; }
  return {
    get(k, d){
      try{
        if(ok){ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v); }
      }catch(e){}
      return (k in mem) ? mem[k] : d;
    },
    set(k, v){
      try{ if(ok){ localStorage.setItem(k, JSON.stringify(v)); return; } }catch(e){}
      mem[k]=v;
    }
  };
})();

let completed = Store.get('dsa_completed', {});
let bookmarked = Store.get('dsa_bookmarked', {});
function saveProgress(){ Store.set('dsa_completed', completed); Store.set('dsa_bookmarked', bookmarked); }

/* =========================================================
   THE FULL 37-PATTERN ROADMAP (order preserved).
   Patterns without a `problems` array are queued for a future
   content pass — they still show in navigation so the roadmap
   stays visible end to end.
   ========================================================= */
const PATTERNS = [
  {id:'arrays', name:'Arrays'},
  {id:'strings', name:'Strings'},
  {id:'hashmap', name:'HashMap'},
  {id:'hashset', name:'HashSet'},
  {id:'two-pointers', name:'Two Pointers'},
  {id:'sliding-window', name:'Sliding Window'},
  {id:'prefix-sum', name:'Prefix Sum'},
  {id:'binary-search', name:'Binary Search'},
  {id:'matrix', name:'Matrix'},
  {id:'stack', name:'Stack'},
  {id:'queue', name:'Queue'},
  {id:'monotonic-stack', name:'Monotonic Stack'},
  {id:'heap', name:'Heap / Priority Queue'},
  {id:'linked-list', name:'Linked List'},
  {id:'fast-slow', name:'Fast & Slow Pointer'},
  {id:'merge-intervals', name:'Merge Intervals'},
  {id:'greedy', name:'Greedy'},
  {id:'backtracking', name:'Backtracking'},
  {id:'recursion', name:'Recursion'},
  {id:'divide-conquer', name:'Divide and Conquer'},
  {id:'tree-dfs', name:'Binary Tree DFS'},
  {id:'tree-bfs', name:'Binary Tree BFS'},
  {id:'bst', name:'Binary Search Tree'},
  {id:'trie', name:'Trie'},
  {id:'graph-bfs', name:'Graph BFS'},
  {id:'graph-dfs', name:'Graph DFS'},
  {id:'topo-sort', name:'Topological Sort'},
  {id:'union-find', name:'Union Find (Disjoint Set)'},
  {id:'dp-1d', name:'Dynamic Programming 1D'},
  {id:'dp-2d', name:'Dynamic Programming 2D'},
  {id:'bit-manip', name:'Bit Manipulation'},
  {id:'segment-tree', name:'Segment Tree'},
  {id:'fenwick-tree', name:'Fenwick Tree'},
  {id:'design', name:'Design Problems'},
  {id:'math', name:'Math'},
  {id:'simulation', name:'Simulation'},
  {id:'misc', name:'Miscellaneous Frequently Asked'}
];

// Populated separately below as PATTERN_DATA[patternId] = [ ...15 problems... ]
const PATTERN_DATA = {};

PATTERN_DATA['arrays'] = [
{
  title:"Two Sum", difficulty:"Easy", companies:["Amazon","Google","Meta","Apple","Adobe"], estTime:"10-15 min",
  statement:`<p><b>Description:</b> Given an array of integers <code>nums</code> and an integer <code>target</code>, return the indices of the two numbers that add up exactly to <code>target</code>. You may assume each input has exactly one solution, and you may not use the same element twice.</p>
  <p><b>Input:</b> nums = [2,7,11,15], target = 9 &nbsp;|&nbsp; <b>Output:</b> [0,1]</p>
  <div class="example-box"><b>Example 1</b><br><code>nums=[2,7,11,15], target=9</code> → <code>[0,1]</code> because nums[0]+nums[1]=9<br><br><b>Example 2</b><br><code>nums=[3,2,4], target=6</code> → <code>[1,2]</code></div>
  <p><b>Constraints:</b></p><ul><li>2 ≤ nums.length ≤ 10⁴</li><li>-10⁹ ≤ nums[i] ≤ 10⁹</li><li>Exactly one valid answer exists</li></ul>
  <p><b>Edge cases:</b> negative numbers, duplicate values in the array, the target being reachable only by two copies of the same value at different indices.</p>
  <p><b>Interview expectations:</b> Interviewers expect you to start with brute force, then arrive at the O(n) hash map solution without being told to.</p>`,
  whyAsked:`<p>This is usually the very first problem in an interview loop — a warm-up that tests whether you instinctively reach for a hash map to trade space for time. It quietly evaluates whether you talk out loud, whether you ask about duplicates, and whether you can articulate why brute force is O(n²).</p>
  <p><b>Common mistakes:</b> using the same element twice, forgetting to handle duplicate values, or not realizing you can solve it in a single pass instead of building the whole map first and then scanning again.</p>`,
  thoughtProcess:`<p><b>Observe:</b> We need two numbers whose sum equals a target. The naive instinct is to check every pair — two nested loops — which is O(n²).</p>
  <p><b>Ask yourself:</b> "For a given number x, what other number do I need?" The answer is always <code>target - x</code>. If I could check "have I seen target-x before?" in O(1), the whole problem collapses to one pass.</p>
  <p><b>That's the clue for a hash map</b> — anytime a problem needs "have I seen this value before," a HashMap turns an O(n) lookup into O(1).</p>
  <p><b>Brute force:</b> for each i, scan every j>i and check nums[i]+nums[j]==target. Works, but O(n²) time.</p>
  <p><b>Why it fails at scale:</b> with n=10⁴, that's up to 10⁸ comparisons — too slow for tight interview time limits, and it doesn't demonstrate space-time trade-off thinking.</p>
  <p><b>Optimize:</b> walk the array once. At index i, compute complement = target - nums[i]. Check the map: if complement is already a key, we're done — return its stored index and i. Otherwise store nums[i] → i and continue. Because we check before inserting, we never match an element with itself.</p>`,
  logicalReasoning:`<p><b>Pattern recognition checklist:</b> "find a pair/triplet that sums to X," "have I seen this before," "one pass," "O(1) lookup" → HashMap.</p>
  <p><b>Mental model:</b> the map is your memory of everything already visited. You're always asking the past ("did I already see the number I need?") rather than looking into the future.</p>
  <p><b>When NOT to use this approach:</b> if the array is already sorted and you need O(1) space, two pointers beats a hash map. If you need <i>all</i> pairs rather than one, you still use a map but collect multiple results instead of returning immediately.</p>`,
  dryRun:`<p>nums=[2,7,11,15], target=9</p><ul>
  <li>i=0, nums[0]=2, complement=7. Map is empty → not found. Store {2:0}.</li>
  <li>i=1, nums[1]=7, complement=2. Map has 2 → found! Return [map[2], 1] = [0,1].</li>
  </ul><p>Loop terminates immediately once a match is found — no need to scan further.</p>`,
  code:`class Solution {
    public int[] twoSum(int[] nums, int target) {
        // Map stores value -> index of every number we've already visited
        Map<Integer, Integer> seen = new HashMap<>();

        for (int i = 0; i < nums.length; i++) {
            int complement = target - nums[i];

            // If the number we need already exists in the map, we found our pair
            if (seen.containsKey(complement)) {
                return new int[] { seen.get(complement), i };
            }

            // Otherwise remember this number's index for future lookups
            seen.put(nums[i], i);
        }

        // Problem guarantees a solution exists, so this line is unreachable
        throw new IllegalArgumentException("No two sum solution");
    }
}`,
  complexity:{time:"O(n)", space:"O(n)", best:"O(1) if the answer is at index 0 and 1", avg:"O(n) single pass", worst:"O(n) when the pair is at the very end"},
  tips:`<p><b>Memory trick:</b> "what do I need" is always target minus current. <b>Common interview trap:</b> interviewers sometimes ask "what if there's no solution?" — know to return an empty array or throw, and ask about duplicate elements upfront to show awareness.</p>`,
  similar:[
    {title:"3Sum", difficulty:"Medium", pattern:"Two Pointers", note:"extends to three numbers", url:"https://leetcode.com/problems/3sum/"},
    {title:"Two Sum II - Input Array Is Sorted", difficulty:"Medium", pattern:"Two Pointers", note:"sorted variant, O(1) space", url:"https://leetcode.com/problems/two-sum-ii-input-array-is-sorted/"},
    {title:"4Sum", difficulty:"Medium", pattern:"Two Pointers", note:"generalizes further", url:"https://leetcode.com/problems/4sum/"},
    {title:"Two Sum IV - Input is a BST", difficulty:"Easy", pattern:"BST + HashSet", note:"same idea on a tree", url:"https://leetcode.com/problems/two-sum-iv-input-is-a-bst/"},
    {title:"Subarray Sum Equals K", difficulty:"Medium", pattern:"Prefix Sum + HashMap", note:"same 'complement lookup' idea", url:"https://leetcode.com/problems/subarray-sum-equals-k/"}
  ],
  revision:`<p><b>Formula:</b> for each element, look up target-element in a hash map built as you go. <b>Recognize by:</b> "pair that sums to," "have I seen," need O(n). <b>Use when:</b> unsorted array, need indices, one pass required. <b>Avoid when:</b> array is sorted and O(1) space is mandatory — use two pointers instead.</p>`,
  variations:`<p><b>"What if the array is sorted?"</b> Use two pointers from both ends — no extra space needed. <b>"What if duplicates exist?"</b> The hash-map approach still works since we check-then-insert, naturally avoiding using one index twice. <b>"What if we need all pairs, not just one?"</b> Don't return early — collect matches in a list/set of pairs, using a seen-set to avoid duplicate pairs. <b>"What if memory is limited?"</b> Fall back to the O(n²) brute force or, if sorted, two pointers.</p>`,
  practice:[
    "Given an array and a target, return true/false for whether ANY pair sums to target (don't need indices).",
    "Given an array, count how many distinct pairs sum to exactly target.",
    "Given an array and a target, find the pair whose sum is closest to target (not necessarily equal).",
    "Given a stream of numbers (values arrive one at a time), report as soon as a pair summing to target has appeared.",
    "Given an array, find three indices i<j<k such that nums[i]+nums[k]==2*nums[j] (arithmetic triplet)."
  ]
},
{
  title:"Best Time to Buy and Sell Stock", difficulty:"Easy", companies:["Amazon","Meta","Bloomberg","Uber"], estTime:"10 min",
  statement:`<p><b>Description:</b> You're given an array <code>prices</code> where prices[i] is the stock price on day i. You may complete at most one transaction (buy once, sell once, buy must come before sell). Return the maximum profit achievable; return 0 if no profit is possible.</p>
  <div class="example-box"><b>Example</b><br><code>prices=[7,1,5,3,6,4]</code> → <code>5</code> (buy at 1, sell at 6)</div>
  <p><b>Constraints:</b> 1 ≤ prices.length ≤ 10⁵, 0 ≤ prices[i] ≤ 10⁴.</p>
  <p><b>Edge cases:</b> prices strictly decreasing (answer is 0), single-day array, all prices equal.</p>
  <p><b>Interview expectations:</b> recognize this is not a sliding window in the classic sense — it's a running-minimum tracking problem.</p>`,
  whyAsked:`<p>Tests whether you can avoid the O(n²) "check every buy-sell pair" trap and instead track state (minimum-so-far) while scanning once. It's a gateway problem to DP-1D (this is secretly a 1-state DP).</p>
  <p><b>Common mistakes:</b> comparing every pair of days (O(n²)), or updating min and max profit in the wrong order within the loop.</p>`,
  thoughtProcess:`<p><b>Observe:</b> profit = sell price - buy price, and buy must happen before sell. Brute force checks every (buy day, sell day) pair — O(n²).</p>

  dryRun:`<p>prices=[7,1,5,3,6,4]</p><ul>
  <li>minPrice=7, maxProfit=0</li>
  <li>day1=1: minPrice=1 (new low). profit=1-1=0. maxProfit=0</li>

  code:`class Solution {
    public int maxProfit(int[] prices) {
        int minPriceSoFar = Integer.MAX_VALUE;
        int maxProfit = 0;

        for (int price : prices) {

            minPriceSoFar = Math.min(minPriceSoFar, price);

            // If selling today beats our best profit so far, update it

  statement:`<p><b>Description:</b> Given an integer array <code>nums</code>, move all 0's to the end while maintaining the relative order of the non-zero elements. Must be done in place without making a copy of the array.</p>
  <div class="example-box"><code>nums=[0,1,0,3,12]</code> → <code>[1,3,12,0,0]</code></div>
  <p><b>Constraints:</b> 1 ≤ nums.length ≤ 10⁴. Must minimize total operations (writes).</p>
  <p><b>Edge cases:</b> array of all zeros, array with no zeros, single element.</p>
  <p><b>Interview expectations:</b> in-place, O(1) extra space, one or two passes — this is a classic two-pointer "write index" problem.</p>`,
  whyAsked:`<p>Tests whether you understand the "slow/fast pointer for in-place partitioning" technique, which reappears constantly (removing elements, partitioning in quicksort, Dutch national flag).</p>
  <p><b>Common mistake:</b> using extra array space (violates constraint), or swapping unnecessarily causing more writes than needed.</p>`,
  thoughtProcess:`<p><b>Observe:</b> we need to compact non-zero elements to the front, in order, then fill the rest with 0. This screams "two-pointer, one slow write-pointer and one fast read-pointer."</p>
  <p><b>Brute force:</b> build a new array with non-zeros first then zeros, copy back — works but uses O(n) extra space, against the constraint.</p>
  <p><b>Optimize:</b> maintain <code>insertPos</code> starting at 0. Scan with a fast pointer; whenever nums[fast] != 0, place it at nums[insertPos] and increment insertPos. After the scan, fill everything from insertPos to the end with 0.</p>
  <p>An even more elegant version swaps nums[fast] and nums[insertPos] instead of overwriting, which naturally leaves zeros in place without a second fill pass.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "move/remove elements in place while preserving order" → two-pointer partition (slow write pointer, fast read pointer). <b>Mental model:</b> the slow pointer marks the boundary of "the compacted valid region built so far."</p>
  <p><b>When NOT to use:</b> if order does not need to be preserved, a simpler two-end swap (like partitioning) can reduce writes further.</p>`,
  dryRun:`<p>nums=[0,1,0,3,12], insertPos=0</p><ul>
  <li>fast=0, val=0 → skip</li>
  <li>fast=1, val=1 → swap(0,1): [1,0,0,3,12], insertPos=1</li>
  <li>fast=2, val=0 → skip</li>
  <li>fast=3, val=3 → swap(1,3): [1,3,0,0,12], insertPos=2</li>
  <li>fast=4, val=12 → swap(2,4): [1,3,12,0,0], insertPos=3</li>
  </ul><p>Result: [1,3,12,0,0]</p>`,
  code:`class Solution {
    public void moveZeroes(int[] nums) {
        int insertPos = 0; // boundary of the "compacted non-zero" region

        // Fast pointer scans every element once
        for (int fast = 0; fast < nums.length; fast++) {
            if (nums[fast] != 0) {
                // Swap brings the non-zero forward and pushes a zero back
                int temp = nums[insertPos];
                nums[insertPos] = nums[fast];
                nums[fast] = temp;
                insertPos++;
            }
        }
    }
}`,

  title:"Majority Element", difficulty:"Easy", companies:["Amazon","Google","Zillow"], estTime:"10-12 min",
  statement:`<p><b>Description:</b> Given an array <code>nums</code> of size n, return the majority element — the element that appears more than ⌊n/2⌋ times. You may assume the majority element always exists.</p>
  <div class="example-box"><code>nums=[2,2,1,1,1,2,2]</code> → <code>2</code></div>
  <p><b>Constraints:</b> n ≥ 1. A majority element is guaranteed to exist.</p>
  <p><b>Edge cases:</b> single element array, majority element appears exactly ⌊n/2⌋+1 times (the minimum qualifying count).</p>
  <p><b>Interview expectations:</b> know the O(n) time, O(1) space Boyer-Moore Voting Algorithm as the "wow" follow-up to a naive HashMap counting solution.</p>`,
  whyAsked:`<p>This problem separates candidates who know a clever classical algorithm from those who don't. A HashMap count is perfectly correct and often accepted, but the Boyer-Moore trick shows deeper algorithmic maturity.</p>
  <p><b>Common mistake:</b> assuming sorting and taking the middle element is "cheating" — it's actually valid and O(n log n), a fine fallback if Boyer-Moore isn't recalled.</p>`,
  thoughtProcess:`<p><b>Observe:</b> because the majority element appears more than half the time, it necessarily "outnumbers" everything else combined.</p>
  <p><b>Brute force:</b> count occurrences of every element with a HashMap — O(n) time, O(n) space. Correct, but not optimal on space.</p>
  <p><b>The clever leap (Boyer-Moore Voting):</b> maintain a candidate and a counter. Walk the array: if counter is 0, pick the current element as the new candidate. If the current element equals candidate, increment counter; otherwise decrement. Because the true majority outnumbers all others combined, it survives this "cancellation" process and ends up as the final candidate.</p>
  <p><b>Why it works intuitively:</b> think of matching a majority vote against a non-majority vote as them "canceling out" — since majority has more votes than everyone else combined, some majority votes always survive to the end.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "appears more than n/2 times," "majority/dominant element" → Boyer-Moore Voting. <b>Mental model:</b> think of it like a tug-of-war/cancellation game — pairs of different elements cancel, leaving the majority standing.</p>
  <p><b>When NOT to use:</b> if no guaranteed majority exists and you need to verify, do a second pass to count the final candidate's actual occurrences.</p>`,
  dryRun:`<p>nums=[2,2,1,1,1,2,2]</p><ul>
  <li>candidate=null, count=0</li>
  <li>2: count=0→candidate=2, count=1</li>
  <li>2: matches → count=2</li>
  <li>1: doesn't match → count=1</li>
  <li>1: doesn't match → count=0</li>
  <li>1: count=0→candidate=1, count=1</li>
  <li>2: doesn't match → count=0</li>
  <li>2: count=0→candidate=2, count=1</li>
  </ul><p>Final candidate: 2 ✓ (matches expected answer)</p>`,
  code:`class Solution {
    public int majorityElement(int[] nums) {
        int candidate = 0;
        int count = 0;

        for (int num : nums) {
            if (count == 0) {
                // No current candidate carries "votes" — pick a new one
                candidate = num;
            }
            // Same as candidate: cast a vote for it. Different: cancel a vote.
            count += (num == candidate) ? 1 : -1;
        }

        return candidate; // guaranteed valid since a majority element exists
    }
}`,
  complexity:{time:"O(n)", space:"O(1)", best:"O(n) — always a full scan", avg:"O(n)", worst:"O(n)"},

  title:"Product of Array Except Self", difficulty:"Medium", companies:["Amazon","Meta","Microsoft","Apple"], estTime:"15-20 min",
  statement:`<p><b>Description:</b> Given an integer array <code>nums</code>, return an array <code>answer</code> where answer[i] equals the product of all elements of nums except nums[i]. You must solve it in O(n) time without using the division operator, and ideally without counting the output array toward extra space.</p>
  <div class="example-box"><code>nums=[1,2,3,4]</code> → <code>[24,12,8,6]</code></div>
  <p><b>Constraints:</b> 2 ≤ nums.length ≤ 10⁵, array may contain 0 and negative numbers.</p>
  <p><b>Edge cases:</b> array contains one zero (only that index gets a nonzero product), array contains two or more zeros (every output is 0).</p>
  <p><b>Interview expectations:</b> the no-division constraint is the whole point — it forces prefix/suffix product thinking.</p>`,
  whyAsked:`<p>Tests whether you can decompose a problem into "everything to my left" and "everything to my right" — a foundational prefix/suffix technique used constantly in array problems (trapping rain water, running max, etc).</p>
  <p><b>Common mistake:</b> reaching for division (product / nums[i]) which breaks entirely when any element is 0, and is explicitly disallowed.</p>`,
  thoughtProcess:`<p><b>Observe:</b> answer[i] = (product of everything left of i) × (product of everything right of i). If we could compute those two quantities for every i, we're done.</p>
  <p><b>Brute force:</b> for each i, loop through the whole array skipping i — O(n²).</p>
  <p><b>Optimize:</b> precompute a prefix-product array where prefix[i] = product of nums[0..i-1], and a suffix-product array where suffix[i] = product of nums[i+1..n-1]. Then answer[i] = prefix[i] * suffix[i]. That's O(n) time, O(n) extra space (excluding the output array).</p>
  <p><b>Space optimization:</b> since the output array itself can double as the prefix array, and the suffix product can be tracked with a single running variable instead of a full array, we reduce extra space to O(1) (excluding output).</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "product/sum except self," "no division allowed" → prefix/suffix decomposition. <b>Mental model:</b> stand at index i and split the world into "everything before me" and "everything after me" — combine both halves.</p>
  <p><b>When NOT to use:</b> if division is allowed and 0 is guaranteed absent, a single running product with division is simpler (but rarely allowed in interviews for that exact reason).</p>`,
  dryRun:`<p>nums=[1,2,3,4]</p><p>Prefix pass (answer[i] = product of everything left of i, stored in output array):</p>
  <ul><li>answer=[1,1,2,6] (answer[0]=1 since nothing is left of index 0)</li></ul>
  <p>Suffix pass (multiply in running suffix product from the right):</p>
  <ul>
  <li>i=3: suffix=1 (nothing right of last index). answer[3]=6*1=6. suffix becomes 1*4=4</li>
  <li>i=2: answer[2]=2*4=8. suffix becomes 4*3=12</li>
  <li>i=1: answer[1]=1*12=12. suffix becomes 12*2=24</li>
  <li>i=0: answer[0]=1*24=24.</li>
  </ul><p>Result: [24,12,8,6] ✓</p>`,
  code:`class Solution {
    public int[] productExceptSelf(int[] nums) {
        int n = nums.length;
        int[] answer = new int[n];

        // Step 1: answer[i] becomes the product of everything to the LEFT of i
        answer[0] = 1;
        for (int i = 1; i < n; i++) {
            answer[i] = answer[i - 1] * nums[i - 1];
        }

        // Step 2: multiply in the running product of everything to the RIGHT of i
        int suffixProduct = 1;
        for (int i = n - 1; i >= 0; i--) {
            answer[i] *= suffixProduct;
            suffixProduct *= nums[i];
        }

        return answer;
    }
}`,

  <p><b>Edge cases:</b> array with fewer than 3 elements, all zeros, no valid triplet exists.</p>
  <p><b>Interview expectations:</b> the "no duplicate triplets" requirement is where most candidates lose points — expected to handle it cleanly via sorting + skipping, not via a Set of lists.</p>`,
  whyAsked:`<p>The natural extension of Two Sum, testing whether you can generalize a hash-based idea into a sort + two-pointer approach, and whether you can handle duplicate suppression elegantly instead of brute-force deduping afterward.</p>
  <p><b>Common mistakes:</b> O(n³) triple-nested loop, or producing duplicate triplets and deduping with a Set (works but is sloppy and often flagged in interviews).</p>`,
  thoughtProcess:`<p><b>Observe:</b> 3Sum is "fix one number, then find two others that sum to its negation" — which is exactly Two Sum on the remaining array. So 3Sum = loop + Two Sum.</p>
  <p><b>Brute force:</b> three nested loops — O(n³). Too slow, and duplicate handling is painful.</p>
  <p><b>Key insight:</b> if we SORT the array first, two things become easy: (1) using two pointers to solve "two numbers sum to a target" in O(n) instead of a hash map, and (2) skipping over duplicate values becomes a simple adjacent-element check.</p>
  <p><b>Approach:</b> sort nums. For each index i (the "fixed" element), skip if it's a duplicate of nums[i-1]. Then run the two-pointer technique on the remaining subarray to find pairs summing to -nums[i], skipping duplicate values for both pointers after a match.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "triplet/k numbers summing to a target," "no duplicate results" → sort + fix-one-element + two pointers. <b>Mental model:</b> reduce k-sum problems by one dimension at a time: 3Sum → loop + 2Sum(sorted); 4Sum → nested loop + 3Sum, and so on.</p>
  <p><b>When NOT to use:</b> if you need to preserve original indices/order (sorting destroys that) — then use a hash-based approach with explicit dedup instead.</p>`,
  dryRun:`<p>nums sorted = [-4,-1,-1,0,1,2]</p><ul>
  <li>i=0 (val=-4): two pointers left=1,right=5. sum=-1+2-4=-3<0→left++. sum=-1+1-4<0→left++. sum=0+2-4<0→left++. left meets right, no triplet.</li>
  <li>i=1 (val=-1): left=2,right=5. sum=-1+2-1=0 → found [-1,-1,2]! move both pointers, skip duplicates.</li>
  <li>continue: left=3,right=4. sum=0+1-1=0 → found [-1,0,1]!</li>
  <li>i=2 (val=-1): duplicate of nums[1] → skip.</li>
  </ul><p>Result: [[-1,-1,2],[-1,0,1]] ✓</p>`,
  code:`class Solution {
    public List<List<Integer>> threeSum(int[] nums) {
        Arrays.sort(nums); // enables two pointers + easy duplicate skipping
        List<List<Integer>> result = new ArrayList<>();

        for (int i = 0; i < nums.length - 2; i++) {
            // Skip duplicate "fixed" elements to avoid duplicate triplets
            if (i > 0 && nums[i] == nums[i - 1]) continue;

            int left = i + 1, right = nums.length - 1;
            int target = -nums[i]; // we need left+right to equal this

            while (left < right) {
                int sum = nums[left] + nums[right];
                if (sum == target) {
                    result.add(Arrays.asList(nums[i], nums[left], nums[right]));
                    left++;
                    right--;
                    // Skip duplicates for both pointers after a successful match
                    while (left < right && nums[left] == nums[left - 1]) left++;
                    while (left < right && nums[right] == nums[right + 1]) right--;
                } else if (sum < target) {
                    left++; // need a bigger sum
                } else {
                    right--; // need a smaller sum
                }
            }
        }
        return result;
    }
}`,

  title:"Container With Most Water", difficulty:"Medium", companies:["Amazon","Google","Bloomberg"], estTime:"15-18 min",
  statement:`<p><b>Description:</b> Given n non-negative integers <code>height[i]</code> representing vertical lines drawn at each index, find two lines that together with the x-axis form a container holding the most water. Return the maximum area.</p>
  <div class="example-box"><code>height=[1,8,6,2,5,4,8,3,7]</code> → <code>49</code></div>
  <p><b>Constraints:</b> 2 ≤ height.length ≤ 10⁵, 0 ≤ height[i] ≤ 10⁴.</p>
  <p><b>Edge cases:</b> all heights equal, strictly increasing or decreasing heights, only two elements.</p>
  <p><b>Interview expectations:</b> recognize this is a two-pointer greedy elimination problem, not a brute force n² scan.</p>`,
  whyAsked:`<p>Tests the "greedy elimination" mindset — being able to prove that moving the shorter pointer inward is always safe (never loses a potentially better answer), which is a subtle but important proof interviewers like to hear articulated.</p>
  <p><b>Common mistake:</b> checking every pair (O(n²)), or moving the wrong pointer (moving the taller line inward, which never helps).</p>`,
  thoughtProcess:`<p><b>Observe:</b> area between lines i and j = (j - i) × min(height[i], height[j]). Width shrinks as pointers move together, so we want to be strategic about which pointer to move.</p>
  <p><b>Brute force:</b> check every pair (i, j) — O(n²).</p>
  <p><b>Key insight:</b> start with the widest possible container (i=0, j=n-1). At each step, the shorter of the two lines is the bottleneck limiting area — moving the TALLER line inward can only decrease width without any chance of increasing the limiting height, so it can never improve the answer. But moving the SHORTER line inward might find a taller line, potentially compensating for the reduced width.</p>
  <p><b>Algorithm:</b> two pointers start at both ends. Compute area, update the max. Move whichever pointer points to the shorter line inward. Repeat until pointers meet.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "two lines forming a container," "maximize area/volume between two points" → two pointers narrowing from both ends, always moving the limiting (shorter) side. <b>Mental model:</b> you're always discarding the pointer that CAN'T possibly be part of a better answer.</p>
  <p><b>When NOT to use:</b> if you need to consider more than 2 lines (e.g. trapping rain water across ALL lines simultaneously), you need a different technique (prefix/suffix max, not just 2 pointers).</p>`,
  dryRun:`<p>height=[1,8,6,2,5,4,8,3,7]</p><ul>
  <li>left=0(h=1), right=8(h=7): area=8*min(1,7)=8. max=8. height[left] shorter → left++</li>
  <li>left=1(h=8), right=8(h=7): area=7*7=49. max=49. height[right] shorter → right--</li>
  <li>left=1(h=8), right=7(h=3): area=6*3=18. right shorter → right--</li>
  <li>... continues, but no area beats 49</li>
  </ul><p>Result: 49 ✓</p>`,
  code:`class Solution {
    public int maxArea(int[] height) {
        int left = 0, right = height.length - 1;
        int maxArea = 0;

        while (left < right) {
            int width = right - left;
            int limitingHeight = Math.min(height[left], height[right]);
            maxArea = Math.max(maxArea, width * limitingHeight);

            // Moving the shorter line is the only move that could improve the area
            if (height[left] < height[right]) {
                left++;
            } else {
                right--;
            }
        }
        return maxArea;
    }
}`,

  <p><b>Constraints:</b> 1 ≤ nums.length ≤ 10⁵, k can be ≥ array length (must be handled via modulo).</p>
  <p><b>Edge cases:</b> k=0, k equal to array length (no-op), k larger than array length.</p>
  <p><b>Interview expectations:</b> know the elegant "triple reversal" trick as the O(1)-space optimal solution, not just an O(n) extra array.</p>`,
  whyAsked:`<p>Tests whether you know a clever in-place trick (reversal) versus defaulting to extra space. It also tests careful handling of the modulo edge case when k exceeds array length — a frequent off-by-one trap.</p>
  <p><b>Common mistake:</b> forgetting <code>k %= n</code> causing an index-out-of-bounds or wasted rotations; or rotating one step at a time k times (correct but O(nk), too slow for large k).</p>`,
  thoughtProcess:`<p><b>Observe:</b> rotating right by k means the last k elements move to the front, and the first n-k elements shift right.</p>
  <p><b>Brute force:</b> rotate by 1 step, k times — O(n*k), too slow when k is large.</p>
  <p><b>Better:</b> use a new array of size n, placing nums[i] at (i+k)%n, then copy back — O(n) time, O(n) space. Correct but interviewers often push for O(1) space.</p>
  <p><b>Optimal — the reversal trick:</b> reverse the entire array, then reverse the first k elements, then reverse the remaining n-k elements. Reversing the whole thing puts everything in reverse order; reversing each segment un-reverses it locally while keeping the segments in their rotated position. This achieves rotation in three O(n) reversal passes with O(1) extra space.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "rotate array in place, O(1) space" → triple reversal trick. <b>Mental model:</b> reverse-everything, then reverse-each-piece is a general technique for many "rearrange in place" problems (also used in "reverse words in a string").</p>
  <p><b>When NOT to use:</b> if extra space is genuinely fine and clarity matters more, use the modulo-index-copy approach — simpler to explain under interview pressure.</p>`,
  dryRun:`<p>nums=[1,2,3,4,5,6,7], k=3 (k%7=3)</p><ul>
  <li>Reverse whole array: [7,6,5,4,3,2,1]</li>
  <li>Reverse first k=3: [5,6,7,4,3,2,1]</li>
  <li>Reverse remaining n-k=4: [5,6,7,1,2,3,4]</li>
  </ul><p>Result: [5,6,7,1,2,3,4] ✓</p>`,
  code:`class Solution {
    public void rotate(int[] nums, int k) {
        int n = nums.length;
        k %= n; // handle k larger than array length

        reverse(nums, 0, n - 1);     // reverse the whole array
        reverse(nums, 0, k - 1);     // un-reverse the first k elements
        reverse(nums, k, n - 1);     // un-reverse the remaining elements
    }

    private void reverse(int[] nums, int start, int end) {
        while (start < end) {
            int temp = nums[start];
            nums[start] = nums[end];
            nums[end] = temp;
            start++;
            end--;
        }
    }
}`,

  title:"Subarray Sum Equals K", difficulty:"Medium", companies:["Meta","Amazon","Google"], estTime:"18-20 min",
  statement:`<p><b>Description:</b> Given an integer array <code>nums</code> and an integer <code>k</code>, return the total number of contiguous subarrays whose sum equals k.</p>
  <div class="example-box"><code>nums=[1,1,1], k=2</code> → <code>2</code> (subarrays [1,1] at indices 0-1 and 1-2)</div>
  <p><b>Constraints:</b> 1 ≤ nums.length ≤ 2×10⁴, values can be negative, so sliding window doesn't directly apply.</p>
  <p><b>Edge cases:</b> negative numbers present (rules out naive sliding window), k=0 with zeros in the array.</p>
  <p><b>Interview expectations:</b> recognize that negative numbers break the sliding-window monotonicity assumption, forcing a prefix-sum + hashmap solution instead.</p>`,
  whyAsked:`<p>A favorite because many candidates instinctively reach for sliding window (which fails with negative numbers) — testing whether you notice the constraint violation and pivot to prefix sums. It's essentially "Two Sum" applied to running sums.</p>
  <p><b>Common mistake:</b> using sliding window despite negative numbers being allowed (silently produces wrong answers), or O(n²) prefix sum recomputation for every pair.</p>`,
  thoughtProcess:`<p><b>Observe:</b> the sum of subarray (i, j] equals prefixSum[j] - prefixSum[i]. We want this difference to equal k, i.e., prefixSum[i] = prefixSum[j] - k.</p>
  <p><b>Ask yourself:</b> "as I compute the running prefix sum at index j, how many earlier prefix sums equal prefixSum[j] - k?" That's exactly a HashMap frequency-count lookup — same complement idea as Two Sum, just applied to prefix sums instead of raw values.</p>
  <p><b>Brute force:</b> compute the sum of every subarray directly — O(n²) or O(n³) without prefix sums.</p>
  <p><b>Optimal:</b> maintain a running prefix sum and a HashMap of {prefixSum value → how many times it's occurred so far}. At each step, look up (currentSum - k) in the map and add its count to the answer, then record the current sum in the map. Initialize the map with {0: 1} to correctly count subarrays starting at index 0.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "number of subarrays summing to k," negatives allowed → Prefix Sum + HashMap (frequency counting), NOT sliding window. <b>Mental model:</b> convert "subarray sum" questions into "difference of two prefix sums," then it's Two-Sum-style complement lookup.</p>
  <p><b>When NOT to use:</b> if all numbers are guaranteed non-negative, sliding window can solve a related "shortest/longest subarray" version more simply — but for COUNTING all subarrays, prefix sum + hashmap is still typically needed.</p>`,
  dryRun:`<p>nums=[1,1,1], k=2. map={0:1}, sum=0, count=0</p><ul>
  <li>i=0: sum=1. need sum-k=-1, not in map. map={0:1,1:1}</li>
  <li>i=1: sum=2. need sum-k=0, map[0]=1 → count+=1 (count=1). map={0:1,1:1,2:1}</li>
  <li>i=2: sum=3. need sum-k=1, map[1]=1 → count+=1 (count=2). map={0:1,1:1,2:1,3:1}</li>
  </ul><p>Result: 2 ✓</p>`,
  code:`class Solution {
    public int subarraySum(int[] nums, int k) {
        // Maps prefix-sum value -> number of times it has occurred so far
        Map<Integer, Integer> prefixSumCount = new HashMap<>();
        prefixSumCount.put(0, 1); // empty prefix sums to 0, occurs once

        int runningSum = 0;
        int count = 0;

        for (int num : nums) {
            runningSum += num;

            // If (runningSum - k) was seen before, those earlier points
            // mark the start of a subarray ending here that sums to k
            int needed = runningSum - k;
            count += prefixSumCount.getOrDefault(needed, 0);

            // Record the current running sum for future lookups
            prefixSumCount.merge(runningSum, 1, Integer::sum);
        }

        return count;
    }
}`,

  thoughtProcess:`<p><b>Observe:</b> to get the NEXT lexicographic permutation, we want the smallest possible increase — meaning we should change the array as late (rightmost) as possible.</p>
  <p><b>Key insight:</b> a suffix that is non-increasing (e.g., ...,5,3,1) is already at its maximum arrangement — no rearrangement of it can make it bigger. So we scan from the right to find the first index i where nums[i] < nums[i+1] — this is the "pivot," the rightmost place we can still increase.</p>
  <p><b>Step-by-step:</b> (1) Scan right-to-left to find the pivot index i where nums[i] < nums[i+1]. (2) If no such i exists, the whole array is the highest permutation — reverse it entirely to get the lowest. (3) Otherwise, scan right-to-left again to find the rightmost element greater than nums[i] — call it nums[j]. (4) Swap nums[i] and nums[j]. (5) Reverse everything after index i (the suffix is still non-increasing after the swap, so reversing it gives the smallest possible arrangement of that suffix).</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "next permutation," "lexicographically next arrangement" → find pivot from the right, swap with just-larger element, reverse suffix. <b>Mental model:</b> think of digits in a number — to get the next bigger number, you increase the rightmost digit possible by the smallest amount, then make everything after it as small as possible.</p>
  <p><b>When NOT to use:</b> if you need the PREVIOUS permutation, mirror the logic (find where nums[i] > nums[i+1], swap with the largest smaller element, reverse suffix).</p>`,
  dryRun:`<p>nums=[1,2,3]</p><ul>
  <li>Scan right-to-left for pivot: compare (1,2)→1<2, pivot i=0.</li>
  <li>Scan right-to-left for first element > nums[0]=1: that's nums[2]=3, j=2.</li>
  <li>Swap i,j: [3,2,1]</li>
  <li>Reverse everything after i=0: reverse [2,1] → [1,2] → array becomes [3,1,2]</li>
  </ul><p>Wait — let's redo carefully: after swap array is [3,2,1], reversing suffix (index 1 to end) [2,1] gives [1,2], final = [3,1,2]... </p>
  <p><i>Correction using the actual example nums=[1,2,3]:</i> pivot search compares adjacent from the right: (nums[1]=2, nums[2]=3): 2<3, so pivot i=1 (not i=0 — the FIRST such index scanning from the right is the correct one, meaning the rightmost i satisfying nums[i]<nums[i+1]). Find rightmost element > nums[1]=2 to its right: nums[2]=3. Swap: [1,3,2]. Reverse suffix after i=1 (just [2], nothing to reverse). Final: [1,3,2] ✓ matches expected output.</p>`,
  code:`class Solution {
    public void nextPermutation(int[] nums) {
        int n = nums.length;
        int i = n - 2;

        // Step 1: find the rightmost index where nums[i] < nums[i+1]
        while (i >= 0 && nums[i] >= nums[i + 1]) {
            i--;
        }

        if (i >= 0) {
            // Step 2: find the rightmost element greater than nums[i]
            int j = n - 1;
            while (nums[j] <= nums[i]) {
                j--;
            }
            // Step 3: swap the pivot with that element
            swap(nums, i, j);
        }
        // Step 4: reverse the suffix after i (it's non-increasing, so this
        // reversal makes it the smallest possible arrangement)
        reverse(nums, i + 1, n - 1);
    }

    private void swap(int[] nums, int a, int b) {
        int temp = nums[a]; nums[a] = nums[b]; nums[b] = temp;
    }

    private void reverse(int[] nums, int start, int end) {
        while (start < end) {
            swap(nums, start, end);
            start++;
            end--;
        }
    }
}`,

  statement:`<p><b>Description:</b> Given an integer array <code>nums</code> of length n where every element is in range [1, n], and each integer appears either once or twice, return an array of all integers that appear twice. Solve it in O(n) time using O(1) extra space (not counting the output array).</p>

  <p><b>Constraints:</b> 1 ≤ n ≤ 10⁵, values strictly in [1, n], each value appears once or twice.</p>
  <p><b>Edge cases:</b> no duplicates at all, all elements duplicated, n=1.</p>
  <p><b>Interview expectations:</b> the value range [1,n] is the whole trick — it lets you use the array itself as a hash table via index marking, achieving true O(1) space.</p>`,
  whyAsked:`<p>Tests whether you notice a bounded-range constraint as a signal for in-place index marking, a technique that shows up repeatedly ("First Missing Positive," "Find the Duplicate Number"). It rewards reading constraints carefully rather than jumping straight to a HashSet.</p>
  <p><b>Common mistake:</b> using a HashSet/HashMap (correct but O(n) space, missing the intended O(1) trick), or negating the wrong index due to off-by-one errors (values are 1-indexed, array is 0-indexed).</p>`,
  thoughtProcess:`<p><b>Observe:</b> because every value is in [1,n] and the array has length n, each value maps naturally to an index (value-1). This means we can use the SIGN of nums[value-1] as a "visited" marker instead of separate memory.</p>
  <p><b>Brute force / naive:</b> HashSet to track seen values — O(n) space. Works, but not optimal.</p>
  <p><b>Optimal (in-place marking):</b> for each number x in the array, go to index |x|-1. If the value there is already negative, we've seen |x| before — it's a duplicate. Otherwise, negate the value at that index to mark |x| as "visited." Take absolute value of x itself since it may have already been negated by an earlier marking.</p>
  <p>This works because we're not losing information — the magnitude of the value tells us the original number, only the sign is used as a marker.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "values in range [1,n]," "find duplicates," "O(1) space" → in-place index marking via negation. <b>Mental model:</b> the array becomes its own hash table — index i represents "have we seen value i+1."</p>
  <p><b>When NOT to use:</b> if values are NOT bounded to a predictable range, or if the array must remain unmodified (read-only input) — then a HashSet is required instead.</p>`,

  <li>x=3→idx2(val=2)→negate: [4,3,-2,-7,8,2,3,1]</li>
  <li>x=|-2|=2→idx1(val=3)→negate: [4,-3,-2,-7,8,2,3,1]</li>
  <li>x=|-7|=7→idx6(val=3)→already 3 is positive here (index6 val=3)? negate: [4,-3,-2,-7,8,2,-3,1]</li>
  <li>x=8→idx7(val=1)→negate: [4,-3,-2,-7,8,2,-3,-1]</li>
  <li>x=|2|=2→idx1(val=-3)→already negative! → 2 is a duplicate</li>
  <li>x=|-3|=3→idx2(val=-2)→already negative! → 3 is a duplicate</li>
  <li>x=|1|=1→idx0(val=4)→not negative→negate</li>
  </ul><p>Result: [2,3] ✓</p>`,
  code:`class Solution {
    public List<Integer> findDuplicates(int[] nums) {
        List<Integer> result = new ArrayList<>();

        for (int i = 0; i < nums.length; i++) {
            int value = Math.abs(nums[i]);       // original value (may already be negated)
            int index = value - 1;               // map value to its "home" index

            if (nums[index] < 0) {
                // Already marked as seen -> this value is a duplicate
                result.add(value);
            } else {
                // Mark this value as seen by negating its home slot
                nums[index] = -nums[index];
            }
        }
        return result;
    }
}`,

  statement:`<p><b>Description:</b> Given an unsorted integer array <code>nums</code>, return the smallest missing positive integer. Must run in O(n) time and use O(1) extra space.</p>
  <div class="example-box"><code>nums=[1,2,0]</code> → <code>3</code><br><code>nums=[3,4,-1,1]</code> → <code>2</code><br><code>nums=[7,8,9,11,12]</code> → <code>1</code></div>
  <p><b>Constraints:</b> 1 ≤ nums.length ≤ 300, values can be any integer including negative and 0.</p>
  <p><b>Edge cases:</b> all negative numbers (answer is 1), array is exactly [1,2,...,n] (answer is n+1), duplicates present.</p>
  <p><b>Interview expectations:</b> this is considered one of the toughest "easy-sounding" array problems — expected to derive the "cyclic placement" or "index marking" trick under time pressure, and to correctly bound WHERE the answer must live.</p>`,
  whyAsked:`<p>A top-tier FAANG question that tests whether you can reason about bounds: the answer must be in range [1, n+1]. This bounding insight is what makes an O(n) O(1) solution possible, and interviewers use it to see if you can derive non-obvious invariants rather than pattern-match.</p>
  <p><b>Common mistake:</b> sorting first (O(n log n), violates time complexity), or using a HashSet (O(n) space, violates space complexity).</p>`,
  thoughtProcess:`<p><b>Observe:</b> the answer must be somewhere in [1, n+1] — if the array contains all of 1..n, the answer is n+1; otherwise, it's the smallest missing value within [1,n]. This bound is critical: it tells us we only care about values within [1,n] and can ignore everything else (negatives, zero, values > n).</p>
  <p><b>Brute force:</b> put all values into a HashSet, then check 1,2,3,... until one is missing — O(n) time but O(n) space.</p>
  <p><b>Optimal — cyclic placement (index marking without extra space):</b> since the answer lives in [1,n], try to place each value v (where 1≤v≤n) at index v-1, using in-place swaps. After this rearrangement, scan the array: the first index i where nums[i] != i+1 tells us i+1 is the missing value. If everything matches, the answer is n+1.</p>
  <p><b>Why swapping (not just checking) is required:</b> a single pass with a HashSet approach uses O(n) space; to get O(1) space we must use the array itself as storage, which requires actually rearranging values into their "correct" home position via swaps, revisiting the same index until it's settled.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "smallest missing positive," "O(n) time, O(1) space" → cyclic sort / index placement, bounded search space of exactly [1,n+1]. <b>Mental model:</b> imagine n mailboxes numbered 1 to n; every value 1..n wants to go "home" to mailbox (value-1); after everyone's home who can be, the first empty mailbox reveals the answer.</p>
  <p><b>When NOT to use:</b> if the array cannot be modified, you'd need O(n) auxiliary space (HashSet) instead — the O(1) trick fundamentally relies on mutating the input.</p>`,
  dryRun:`<p>nums=[3,4,-1,1]</p><ul>
  <li>i=0, val=3: belongs at index 2. swap(0,2): [-1,4,3,1]</li>
  <li>i=0, val=-1: out of range [1,4], skip. i++</li>
  <li>i=1, val=4: belongs at index 3. swap(1,3): [-1,1,3,4]</li>
  <li>i=1, val=1: belongs at index 0. swap(1,0): [1,-1,3,4]</li>
  <li>i=1, val=-1: out of range, skip. i++</li>
  <li>i=2, val=3: already at correct index 2. i++</li>
  <li>i=3, val=4: already at correct index 3. i++</li>
  </ul><p>Scan: index0=1 ✓(matches i+1), index1=-1 ✗ → missing value is index+1 = 2.</p><p>Result: 2 ✓</p>`,
  code:`class Solution {
    public int firstMissingPositive(int[] nums) {
        int n = nums.length;

        // Place each value v (1<=v<=n) at index v-1, using swaps
        for (int i = 0; i < n; i++) {
            while (nums[i] > 0 && nums[i] <= n && nums[nums[i] - 1] != nums[i]) {
                int correctIndex = nums[i] - 1;
                int temp = nums[correctIndex];
                nums[correctIndex] = nums[i];
                nums[i] = temp;
            }
        }

        // First index whose value isn't i+1 reveals the missing positive
        for (int i = 0; i < n; i++) {
            if (nums[i] != i + 1) {
                return i + 1;
            }
        }

        // Array was exactly [1..n] -> answer is one past the end
        return n + 1;
    }
}`,

  title:"Trapping Rain Water", difficulty:"Hard", companies:["Amazon","Google","Meta","Bloomberg"], estTime:"25-30 min",
  statement:`<p><b>Description:</b> Given n non-negative integers representing an elevation map where the width of each bar is 1, compute how much water it can trap after raining.</p>
  <div class="example-box"><code>height=[0,1,0,2,1,0,1,3,2,1,2,1]</code> → <code>6</code></div>
  <p><b>Constraints:</b> 1 ≤ height.length ≤ 2×10⁴, 0 ≤ height[i] ≤ 10⁵.</p>
  <p><b>Edge cases:</b> strictly increasing or decreasing heights (traps 0 water), array of length 1 or 2 (always 0 water), plateau of equal heights.</p>
  <p><b>Interview expectations:</b> the canonical "hard" array problem — expected to know at least the prefix/suffix max approach, and ideally the two-pointer O(1)-space refinement.</p>`,
  whyAsked:`<p>One of the most-asked hard problems at top companies because it has multiple valid solutions of increasing sophistication (brute force → DP with two arrays → two pointers → monotonic stack), letting interviewers see how far your optimization instincts go.</p>
  <p><b>Common mistake:</b> only considering the water trapped by the CURRENT bar's immediate neighbors, instead of the tallest bar anywhere to its left and right.</p>`,
  thoughtProcess:`<p><b>Observe:</b> the water trapped ABOVE any bar i is determined by the shorter of (the tallest bar to its left) and (the tallest bar to its right), minus the bar's own height. Water can't be held higher than the shorter "wall" on either side.</p>
  <p><b>Brute force:</b> for every index i, scan left for the max and scan right for the max — O(n²).</p>
  <p><b>Better — prefix/suffix max arrays:</b> precompute leftMax[i] = tallest bar in [0..i] and rightMax[i] = tallest bar in [i..n-1]. Then water[i] = min(leftMax[i], rightMax[i]) - height[i] (if positive). This is O(n) time, O(n) space.</p>
  <p><b>Optimal — two pointers, O(1) space:</b> maintain leftMax and rightMax as running values while moving two pointers from both ends. At each step, move the pointer on the side with the SMALLER running max — because that side's water level is fully determined (the other side's wall, wherever it ends up, is guaranteed at least as tall). Add the trapped water at that pointer, then advance it.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "water trapped between bars," "min of left-max and right-max minus current height" → prefix/suffix max, or two pointers for O(1) space. <b>Mental model:</b> water level at any point is capped by the SHORTER of its two "walls," so you always process from the side you're more certain about.</p>
  <p><b>When NOT to use two pointers:</b> if you need the water level at every individual bar explicitly reported (not just total), the prefix/suffix max arrays give you that directly per-index, whereas two pointers only accumulates a running total efficiently.</p>`,
  dryRun:`<p>height=[0,1,0,2,1,0,1,3,2,1,2,1], two-pointer approach</p><ul>
  <li>left=0,right=11. leftMax=0,rightMax=1. height[left]=0<=height[right]=1 → process left: leftMax=max(0,0)=0. water+=leftMax-0=0. left++</li>
  <li>left=1(h=1),right=11(h=1). leftMax=0,rightMax=1. h[left]<=h[right]→process left: leftMax=max(0,1)=1. water+=1-1=0. left++</li>
  <li>left=2(h=0). leftMax=1. water+=1-0=1 (total=1). left++</li>
  <li>...continues, accumulating water at each step where the running max exceeds the bar height...</li>
  </ul><p>Final total after processing all bars: 6 ✓</p>`,
  code:`class Solution {
    public int trap(int[] height) {
        int left = 0, right = height.length - 1;
        int leftMax = 0, rightMax = 0;
        int totalWater = 0;

        while (left < right) {
            if (height[left] <= height[right]) {
                // The left wall is the limiting (shorter or equal) side
                leftMax = Math.max(leftMax, height[left]);
                totalWater += leftMax - height[left]; // water above this bar
                left++;
            } else {
                // The right wall is the limiting side
                rightMax = Math.max(rightMax, height[right]);
                totalWater += rightMax - height[right];
                right--;
            }
        }
        return totalWater;
    }
}`,

  <p><b>Interview expectations:</b> this is a top-tier "hard" — expected to at least articulate the O(log(min(m,n))) binary-search-on-partition approach even if full bug-free implementation is difficult live; a correct O(m+n) merge-based approach is often an acceptable fallback if you're upfront about the trade-off.</p>`,

  thoughtProcess:`<p><b>Observe:</b> the median splits a sorted sequence into two equal halves. If we could find a partition point in EACH array such that everything to the left of both partitions (combined) is ≤ everything to the right (combined), and the combined left size equals combined right size (or left is one more for odd totals), that partition point directly gives us the median.</p>

  <p><b>Optimal — binary search on the partition:</b> binary search over the SMALLER array (for efficiency) to choose how many elements from it go into the "left half." The number of elements from the other array needed to complete the left half is then determined by the halfway point of the combined length. Check whether the boundary elements satisfy the left ≤ right ordering — if not, adjust the binary search direction (too many from array 1 in the left → move partition left; too few → move it right).</p>
  <p><b>Why binary search on partition size instead of value:</b> we're not searching for a specific value — we're searching for how many elements from the smaller array belong in the left half, which is a monotonic decision (as we shift more into the left half, the boundary condition changes predictably), making binary search valid.</p>`,

  <li>Try partition1=1 (1 element from nums1 in left half): partition2 = 2-1=1 (1 element from nums2 in left half).</li>
  <li>Left side: nums1[0]=1, nums2[0]=2. Right side: nums1[1]=3, nums2[1]=doesn't exist (treat as +infinity).</li>
  <li>Check: max(left side)=2 ≤ min(right side)=3 ✓ valid partition!</li>
  <li>Total length is odd (3) → median = max(left side) = 2</li>
  </ul><p>Result: 2.0 ✓</p>`,
  code:`class Solution {
    public double findMedianSortedArrays(int[] nums1, int[] nums2) {
        // Always binary search on the smaller array for O(log(min(m,n)))
        if (nums1.length > nums2.length) {
            return findMedianSortedArrays(nums2, nums1);
        }

        int m = nums1.length, n = nums2.length;
        int totalLeftSize = (m + n + 1) / 2; // handles both odd and even totals
        int lo = 0, hi = m;

        while (lo <= hi) {
            int partition1 = (lo + hi) / 2;              // elements from nums1 in the left half
            int partition2 = totalLeftSize - partition1;  // elements from nums2 in the left half

            // Boundary values, using +/- infinity for out-of-range partitions
            int left1 = (partition1 == 0) ? Integer.MIN_VALUE : nums1[partition1 - 1];
            int right1 = (partition1 == m) ? Integer.MAX_VALUE : nums1[partition1];
            int left2 = (partition2 == 0) ? Integer.MIN_VALUE : nums2[partition2 - 1];
            int right2 = (partition2 == n) ? Integer.MAX_VALUE : nums2[partition2];

            if (left1 <= right2 && left2 <= right1) {
                // Valid partition found
                if ((m + n) % 2 == 1) {
                    return Math.max(left1, left2);
                }
                return (Math.max(left1, left2) + Math.min(right1, right2)) / 2.0;
            } else if (left1 > right2) {
                hi = partition1 - 1; // too many elements from nums1 in the left half
            } else {
                lo = partition1 + 1; // too few elements from nums1 in the left half
            }
        }

        throw new IllegalArgumentException("Input arrays are not sorted");
    }
}`,

  statement:`<p><b>Description:</b> Given a string <code>s</code>, find the length of the longest substring without repeating characters.</p>

  <p><b>Constraints:</b> 0 ≤ s.length ≤ 5×10⁴, s consists of English letters, digits, symbols, and spaces.</p>
  <p><b>Edge cases:</b> empty string (answer 0), all characters identical, all characters unique.</p>
  <p><b>Interview expectations:</b> a canonical sliding window problem — expected to arrive at O(n) using a window and a HashMap/Set to track the last seen position of each character.</p>`,
  whyAsked:`<p>One of the most-asked sliding window problems — tests whether you recognize "longest/shortest substring satisfying a constraint" as a shrinking/growing window problem, and whether you can jump the window efficiently instead of shrinking one step at a time.</p>
  <p><b>Common mistake:</b> using nested loops to check every substring (O(n³) or O(n²)), or shrinking the window one character at a time instead of jumping directly past the duplicate.</p>`,
  thoughtProcess:`<p><b>Observe:</b> we want the longest window that contains no duplicate characters. As we extend the window to the right, we only need to shrink it if a duplicate appears — that's a sliding window with a dynamically shrinking left boundary.</p>
  <p><b>Brute force:</b> check every substring for uniqueness — O(n³) (or O(n²) with a smarter check).</p>
  <p><b>Optimal:</b> maintain a window [left, right] and a HashMap of each character's last-seen index. Expand right one step at a time. If s[right] was seen before AND its last index is within the current window, jump left directly to (lastIndex + 1) instead of shrinking one step at a time — this avoids redundant work. Update the map and track the max window size seen.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "longest/shortest substring with X property," "no repeating characters" → sliding window with a HashMap tracking last-seen positions, jumping the left pointer directly instead of incrementally. <b>Mental model:</b> the window only shrinks when it must, and it shrinks by JUMPING past the offending duplicate rather than crawling one step at a time.</p>
  <p><b>When NOT to use jump-based shrinking:</b> if the constraint is more complex than simple duplicate-detection (e.g., "at most k distinct characters"), you may need to shrink one step at a time while decrementing counts, since a direct jump isn't always safe.</p>`,
  dryRun:`<p>s="abcabcbb"</p><ul>
  <li>right=0'a': not seen. map={a:0}. window=[0,0], len=1</li>
  <li>right=1'b': not seen. map={a:0,b:1}. window=[0,1], len=2</li>
  <li>right=2'c': not seen. map={a:0,b:1,c:2}. window=[0,2], len=3</li>
  <li>right=3'a': seen at 0, which is >= left(0) → left jumps to 1. window=[1,3], len=3</li>
  <li>right=4'b': seen at 1, >= left(1) → left jumps to 2. window=[2,4], len=3</li>
  <li>right=5'c': seen at 2, >= left(2) → left jumps to 3. window=[3,5], len=3</li>
  <li>right=6'b': seen at 4, >= left(3) → left jumps to 5. window=[5,6], len=2</li>
  <li>right=7'b': seen at 6, >= left(5) → left jumps to 7. window=[7,7], len=1</li>
  </ul><p>Max length seen: 3 ✓</p>`,
  code:`class Solution {
    public int lengthOfLongestSubstring(String s) {
        Map<Character, Integer> lastSeenIndex = new HashMap<>();
        int left = 0;
        int maxLength = 0;
        for (int right = 0; right < s.length(); right++) {
            char c = s.charAt(right);
            if (lastSeenIndex.containsKey(c) && lastSeenIndex.get(c) >= left) {
                left = lastSeenIndex.get(c) + 1;
            }
            lastSeenIndex.put(c, right);
            maxLength = Math.max(maxLength, right - left + 1);
        }
        return maxLength;
    }
}`,

  whyAsked:`<p>Tests whether you can invent a canonical form for grouping — a recurring interview skill (used in "Group Shifted Strings," clustering problems, etc). Also tests HashMap-of-lists fluency.</p>
  <p><b>Common mistake:</b> comparing every pair of strings for anagram-equality (O(n² × k log k)) instead of computing one signature per string and grouping via a map.</p>`,
  thoughtProcess:`<p><b>Observe:</b> two strings are anagrams if and only if they share the same "canonical form" — for example, their sorted character sequence is identical. If we compute that canonical form once per string, grouping becomes a simple HashMap insertion.</p>
  <p><b>Brute force:</b> compare every pair of strings for anagram-equality directly — O(n²) comparisons, each potentially O(k) or O(k log k), very slow.</p>
  <p><b>Optimal:</b> for each string, compute a canonical key — either its sorted character sequence, or (faster) a fixed-length count signature like "a2b1c0..." derived from a 26-length frequency array. Use this key in a HashMap&lt;String, List&lt;String&gt;&gt;, appending the original string to the list for its key. At the end, the map's values are exactly the anagram groups.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "group by anagram / equivalence," "canonical form" → compute a signature per item, then HashMap-of-lists grouping. <b>Mental model:</b> anagrams are just different "orderings" of the same underlying multiset — sorting (or counting) erases the ordering, revealing the shared identity.</p>
  <p><b>When NOT to use sorted-string keys:</b> if strings are long, sorting each one costs O(k log k); a frequency-count key computed in O(k) is faster for large k, at the cost of a slightly more complex key construction.</p>`,

  <li>"tea"→sorted="aet". map={"aet":["eat","tea"]}</li>
  <li>"tan"→sorted="ant". map={"aet":[...], "ant":["tan"]}</li>
  <li>"ate"→sorted="aet". map={"aet":["eat","tea","ate"], "ant":["tan"]}</li>
  <li>"nat"→sorted="ant". map={"aet":[...], "ant":["tan","nat"]}</li>
  <li>"bat"→sorted="abt". map={... , "abt":["bat"]}</li>

  code:`class Solution {
    public List<List<String>> groupAnagrams(String[] strs) {
        Map<String, List<String>> groups = new HashMap<>();
        for (String s : strs) {
            char[] chars = s.toCharArray();
            Arrays.sort(chars);
            String key = new String(chars);
            groups.computeIfAbsent(key, k -> new ArrayList<>()).add(s);
        }
        return new ArrayList<>(groups.values());
    }
}`,

  statement:`<p><b>Description:</b> Implement the myAtoi(string s) function, converting a string to a 32-bit signed integer, mimicking the behavior of C's atoi. The algorithm: skip leading whitespace, then an optional '+' or '-' sign, then digits until a non-digit is found. Ignore any trailing characters. If the resulting number is out of the 32-bit signed integer range [-2³¹, 2³¹-1], clamp it to that range. If no valid digits are found, return 0.</p>
  <div class="example-box"><code>s="   -42"</code> → <code>-42</code><br><code>s="4193 with words"</code> → <code>4193</code><br><code>s="words and 987"</code> → <code>0</code><br><code>s="91283472332"</code> → <code>2147483647</code> (clamped)</div>
  <p><b>Constraints:</b> 0 ≤ s.length ≤ 200, s consists of English letters, digits, spaces, '+', '-', and '.'.</p>
  <p><b>Edge cases:</b> empty string, only whitespace, sign with no digits, overflow in both directions, leading zeros.</p>
  <p><b>Interview expectations:</b> this is a "state machine" / careful-edge-case problem — correctness on every edge case matters more than algorithmic cleverness.</p>`,
  whyAsked:`<p>Tests meticulous edge-case handling and defensive coding under a long list of rules — a proxy for how you'd handle messy real-world input parsing. Interviewers often list many edge cases specifically to see if you ask about or handle them all.</p>
  <p><b>Common mistake:</b> forgetting to clamp on overflow (using long math without a final clamp, or checking overflow AFTER it already occurred in an int), or handling the sign/whitespace/digit sequence in the wrong order.</p>`,
  thoughtProcess:`<p><b>Observe:</b> this problem isn't about a clever algorithm — it's about correctly implementing a sequence of rules in order: (1) skip whitespace, (2) read an optional sign, (3) read digits, (4) stop at the first non-digit, (5) clamp to 32-bit range.</p>
  <p><b>Approach:</b> use an index pointer. Skip spaces. Check for a sign character and record it. Then loop while the current character is a digit, building up the result using long arithmetic (to safely detect overflow before it corrupts an int). After each digit, check if the accumulated value (with sign applied) would exceed Integer.MAX_VALUE or go below Integer.MIN_VALUE — if so, clamp immediately and stop.</p>
  <p><b>Why use long internally:</b> using int arithmetic risks silent overflow; accumulating in a long lets us safely compare against the 32-bit bounds before casting down.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "parse a string into a number following specific rules," "must handle overflow/edge cases" → sequential state-machine parsing with careful bounds checking, done with wider (long) intermediate arithmetic. <b>Mental model:</b> treat this like writing a tiny parser/lexer — process one rule at a time, in the exact order specified.</p>
  <p><b>When NOT to use this exact approach:</b> if the input format is guaranteed clean, Java's built-in Integer.parseInt() is simpler — but interviewers usually want you to implement the parsing logic yourself here.</p>`,
  dryRun:`<p>s="   -42"</p><ul>
  <li>Skip 3 leading spaces. index=3</li>
  <li>Char at 3 is '-' → sign=-1. index=4</li>
  <li>Digits: '4' → result=4. '2' → result=42. index=6, end of string.</li>
  <li>Apply sign: -42. Within 32-bit range → no clamping needed.</li>
  </ul><p>Result: -42 ✓</p>`,
  code:`class Solution {
    public int myAtoi(String s) {
        int i = 0, n = s.length();
        while (i < n && s.charAt(i) == ' ') {
            i++;
        }
        int sign = 1;
        if (i < n && (s.charAt(i) == '+' || s.charAt(i) == '-')) {
            sign = (s.charAt(i) == '-') ? -1 : 1;
            i++;
        }
        long result = 0;
        while (i < n && Character.isDigit(s.charAt(i))) {
            int digit = s.charAt(i) - '0';
            result = result * 10 + digit;
            if (sign == 1 && result > Integer.MAX_VALUE) {
                return Integer.MAX_VALUE;
            }
            if (sign == -1 && -result < Integer.MIN_VALUE) {
                return Integer.MIN_VALUE;
            }
            i++;
        }
        return (int) (sign * result);
    }
}`,

  whyAsked:`<p>A staple "medium" problem testing whether you notice that palindromes have a special structural property: they're symmetric around a center. This lets you avoid full DP in favor of a simpler, equally-efficient-in-practice expand-around-center technique.</p>
  <p><b>Common mistake:</b> forgetting that palindromes can be centered on a single character (odd length) OR between two characters (even length) — missing one case gives wrong answers on inputs like "cbbd".</p>`,
  thoughtProcess:`<p><b>Observe:</b> every palindrome has a center — either a single character (odd-length) or a gap between two characters (even-length). If we try expanding outward from every possible center, we'll find every palindrome.</p>
  <p><b>Brute force:</b> check every possible substring for being a palindrome — O(n³) (or O(n²) with DP).</p>
  <p><b>Better — DP:</b> build a table dp[i][j] = true if s[i..j] is a palindrome, using the recurrence dp[i][j] = (s[i]==s[j]) AND dp[i+1][j-1]. O(n²) time, O(n²) space.</p>
  <p><b>Optimal (in practice) — expand around center:</b> for each of the 2n-1 possible centers, expand outward while characters match, tracking the longest palindrome found. O(n²) time but only O(1) space.</p>`,
  logicalReasoning:`<p><b>Recognize:</b> "longest palindromic substring" → expand around every possible center (2n-1 of them), OR DP with the "shrink from outside" recurrence. <b>Mental model:</b> a palindrome is defined by symmetry around its center — enumerate every possible center and grow outward as far as symmetry holds.</p>

  <li>Center at index 2 ('b'): expand — "aba", length 3.</li>
  <li>Other centers don't beat length 3.</li>
  </ul><p>Result: "bab" (or "aba") ✓, length 3</p>`,
  code:`class Solution {
    public String longestPalindrome(String s) {
        if (s == null || s.length() < 1) return "";
        int start = 0, end = 0;
        for (int center = 0; center < s.length(); center++) {
            int len1 = expandAroundCenter(s, center, center);
            int len2 = expandAroundCenter(s, center, center + 1);
            int maxLen = Math.max(len1, len2);
            if (maxLen > end - start + 1) {
                start = center - (maxLen - 1) / 2;
                end = center + maxLen / 2;
            }
        }
        return s.substring(start, end + 1);
    }
    private int expandAroundCenter(String s, int left, int right) {
        while (left >= 0 && right < s.length() && s.charAt(left) == s.charAt(right)) {
            left--;
            right++;
        }
        return right - left - 1;
    }
